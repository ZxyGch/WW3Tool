; 区域网格：110–130°E，10–30°N（示例：南海/台湾以东海域）
; 运行：python3 ocn_ww3_regional.py --config config_regional.ini

[Regional]
lon_min = 110.0
lon_max = 130.0
lat_min = 10.0
lat_max = 30.0
; DEM 子集外扩（度），利于岸线连通与插值
margin_deg = 1.0
; 矩形边界每条边分段数（越大边界越光滑）
edge_segments = 64
; 立体投影中心（度），取域内即可
stereo_lon = 120.0
stereo_lat = 20.0

[Spacing]
; 高分辨率：岸约 3 km，深水区上限约 25 km（可按机时调大 hmin/hshr）
hmax = 25.0
hshr = 3.0
nwav = 400
hmin = 3.0
dhdx = 0.04

[MeshSettings]
hfun_hmax = 25
mesh_file = scs_110_130_10_30.msh
ww3_mesh_file = scs_110_130_10_30.ww3

[CommandLineArgs]
black_sea = 3

[DataFiles]
dem_file = RTopo_2_0_4_GEBCO_v2024_60sec_pixel.nc
