<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 地球选择区域</title>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js">
</script>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, "Segoe UI", sans-serif; }
  #map { width: 100%; height: 100%; }

  /* Toolbar */
  #toolbar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(32, 32, 32, 0.88); backdrop-filter: blur(8px);
    border-radius: 10px; padding: 6px; display: flex; gap: 4px;
    align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  #toolbar button {
    padding: 6px 14px; border: none; border-radius: 6px; font-size: 13px;
    cursor: pointer; transition: all 0.15s;
  }
  #toolbar button {
    background: transparent; color: #ccc; min-width: 36px;
    display: flex; align-items: center; justify-content: center;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  #toolbar button.active { background: #4a90d9; color: #fff; }
  #toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #toolbar .separator { width: 1px; height: 24px; background: rgba(255,255,255,0.15); margin: 0 4px; }
  .style-select-wrap { position: relative; display: flex; align-items: center; }
  .style-select-wrap::after {
    content: "⌄"; position: absolute; right: 10px; top: 50%; transform: translateY(-56%);
    color: #c8c8c8; font-size: 15px; line-height: 1; pointer-events: none;
  }
  #toolbar select {
    appearance: none; -webkit-appearance: none;
    width: 112px; height: 32px; padding: 0 30px 0 11px;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 6px;
    background: #2d2d2d; color: #f2f2f2; outline: none;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  #toolbar select:hover { background: #383838; border-color: rgba(255,255,255,0.32); }
  #toolbar select:focus { border-color: #4a90d9; box-shadow: 0 0 0 2px rgba(74,144,217,0.22); }
  #toolbar select option { background: #2d2d2d; color: #f2f2f2; }

  /* Info panel */
  #info-panel {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(32, 32, 32, 0.88); backdrop-filter: blur(8px);
    border-radius: 10px; padding: 12px 20px; display: none; align-items: center;
    gap: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    color: #eee; font-size: 13px;
  }
  #info-panel.visible { display: flex; }
  #info-panel .coord-box { text-align: center; }
  #info-panel .coord-box .label { font-size: 11px; color: #999; }
  #info-panel .coord-box .value { font-size: 14px; font-weight: 600; color: #4fc3f7; font-family: 'SF Mono', 'Menlo', monospace; }
  #status-panel {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    max-width: min(420px, calc(100% - 32px));
    padding: 8px 12px; border-radius: 6px;
    background: rgba(32, 32, 32, 0.82); color: #d8d8d8;
    font-size: 12px; box-shadow: 0 3px 14px rgba(0,0,0,0.25);
  }
  #status-panel.error { background: rgba(125, 35, 35, 0.92); color: #fff; }
  #confirm-btn {
    padding: 7px 20px; border: none; border-radius: 6px; font-size: 13px;
    cursor: pointer; font-weight: 500; background: #27ae60; color: white;
  }
  #confirm-btn:hover { background: #219a52; }
  #confirm-btn:disabled { background: #444; color: #888; cursor: default; }
  #confirm-btn:disabled:hover { background: #444; }
  .maplibregl-ctrl-top-right { top: 12px !important; right: 12px !important; }
  .maplibregl-ctrl-top-right .maplibregl-ctrl { margin: 0 0 4px 0; }
  #map-attribution {
    position: absolute; right: 8px; bottom: 6px; z-index: 9;
    padding: 2px 5px; border-radius: 3px;
    background: rgba(255,255,255,0.72); color: #4f5962;
    font-size: 10px; line-height: 1.3; pointer-events: none;
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="status-panel">正在加载高清地图...</div>
<div id="map-attribution">OpenFreeMap © OpenMapTiles · OpenStreetMap</div>

<div id="toolbar">
  <div class="style-select-wrap">
    <select id="style-select" aria-label="地图类型">
      <option value="street">街道图</option>
      <option value="satellite">卫星图</option>
      <option value="dark">暗色图</option>
      <option value="light">亮色图</option>
    </select>
  </div>
  <div class="separator"></div>
  <button id="pan-btn" class="active" title="平移">🖐</button>
  <button id="rect-btn" title="绘制矩形" disabled>▭</button>
</div>

<div id="info-panel">
  <div class="coord-box"><div class="label" id="label-west">西</div><div class="value" id="west">--</div></div>
  <div class="coord-box"><div class="label" id="label-east">东</div><div class="value" id="east">--</div></div>
  <div class="coord-box"><div class="label" id="label-south">南</div><div class="value" id="south">--</div></div>
  <div class="coord-box"><div class="label" id="label-north">北</div><div class="value" id="north">--</div></div>
  <button id="confirm-btn" disabled>✓ 确认</button>
</div>

<script>
(async function() {
  // -- 底图瓦片源 --
  var RASTER_STYLES = {
    street: {
      style: 'https://tiles.openfreemap.org/styles/bright',
      attribution: 'OpenFreeMap © OpenMapTiles · OpenStreetMap'
    },
    satellite: {
      type: 'raster',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      tileSize: 256,
      attribution: '© Esri'
    },
    dark: {
      type: 'raster',
      tiles: ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'],
      tileSize: 256,
      attribution: '© CARTO'
    },
    light: {
      type: 'raster',
      tiles: ['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png'],
      tileSize: 256,
      attribution: '© CARTO'
    }
  };
  var appLanguage = new URLSearchParams(window.location.search).get('lang') === 'en' ? 'en' : 'zh';
  var UI_TEXT = {
    zh: {
      street: '街道图', satellite: '卫星图', dark: '暗色图', light: '亮色图',
      pan: '平移', rectangle: '绘制矩形', confirm: '确认',
      west: '西', east: '东', south: '南', north: '北',
      loading: '正在加载高清地图...', engineError: '地图引擎加载失败，请检查网络连接后重试。',
      ready: '地图已就绪，可拖动地球或点击矩形按钮选择范围。',
      layerError: '矩形图层更新失败，请重新选择底图后重试。',
      styleLoading: '底图正在加载，请稍候再选择矩形。',
      styleTimeout: '底图仍在加载，请稍候再选择矩形。',
      selected: '已选择区域，再次点击矩形按钮可重新选择。',
      drawing: '请在地图上拖动鼠标绘制矩形。', resourceError: '地图资源加载异常：'
    },
    en: {
      street: 'Street', satellite: 'Satellite', dark: 'Dark', light: 'Light',
      pan: 'Pan', rectangle: 'Draw rectangle', confirm: 'Confirm',
      west: 'W', east: 'E', south: 'S', north: 'N',
      loading: 'Loading high-resolution map...', engineError: 'Map engine failed to load. Check the network and retry.',
      ready: 'Map ready. Pan the globe or draw a rectangular region.',
      layerError: 'Rectangle layer failed to update. Switch the map style and retry.',
      styleLoading: 'The map style is loading. Please wait before drawing.',
      styleTimeout: 'The map style is still loading. Please try again shortly.',
      selected: 'Region selected. Click the rectangle button to redraw.',
      drawing: 'Drag on the map to draw a rectangle.', resourceError: 'Map resource error: '
    }
  };
  var text = UI_TEXT[appLanguage];

  // -- 状态 --
  var tool = 'pan';          // 'pan' | 'rect'
  var isDrawing = false;
  var startPoint = null;
  var currentRect = null;
  var hasRect = false;
  var currentStyle = 'street';
  var drawingSourceReady = false;
  var eventsBound = false;
  var lastPoint = null;
  var previewBounds = null;
  var previewFrame = null;

  // -- DOM 引用 --
  var coordEls = {
    west: document.getElementById('west'),
    east: document.getElementById('east'),
    south: document.getElementById('south'),
    north: document.getElementById('north')
  };
  var infoPanel = document.getElementById('info-panel');
  var confirmBtn = document.getElementById('confirm-btn');
  var panBtn = document.getElementById('pan-btn');
  var rectBtn = document.getElementById('rect-btn');
  var styleSelect = document.getElementById('style-select');
  var statusPanel = document.getElementById('status-panel');
  var attributionEl = document.getElementById('map-attribution');

  function setStatus(message, isError) {
    statusPanel.textContent = message;
    statusPanel.classList.toggle('error', Boolean(isError));
  }

  function applyUiLanguage() {
    ['street', 'satellite', 'dark', 'light'].forEach(function(key) {
      styleSelect.querySelector('option[value="' + key + '"]').textContent = text[key];
    });
    panBtn.title = text.pan;
    rectBtn.title = text.rectangle;
    confirmBtn.textContent = '✓ ' + text.confirm;
    ['west', 'east', 'south', 'north'].forEach(function(key) {
      document.getElementById('label-' + key).textContent = text[key];
    });
    setStatus(text.loading, false);
  }

  applyUiLanguage();

  if (typeof maplibregl === 'undefined') {
    setStatus(text.engineError, true);
    return;
  }

  function optimizeStreetStyle(style) {
    var optimized = JSON.parse(JSON.stringify(style));
    optimized.layers = (optimized.layers || []).filter(function(layer) {
      return !/(poi|housenumber|building|aeroway|airport|transit)/i.test(String(layer.id || ''));
    });
    var labelExpression = appLanguage === 'en'
      ? ['get', 'name:en']
      : ['coalesce', ['get', 'name:zh-Hans'], ['get', 'name:zh'], ['get', 'name:en']];
    optimized.layers.forEach(function(layer) {
      if (layer.type !== 'symbol' || !layer.layout || layer.layout['text-field'] == null) return;
      if (JSON.stringify(layer.layout['text-field']).toLowerCase().indexOf('name') === -1) return;
      layer.layout['text-field'] = labelExpression;
    });
    return optimized;
  }

  async function loadStreetStyle() {
    try {
      var response = await fetch(RASTER_STYLES.street.style, { cache: 'force-cache' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return optimizeStreetStyle(await response.json());
    } catch (_) {
      return RASTER_STYLES.street.style;
    }
  }

  var streetStyle = await loadStreetStyle();

  // -- MapLibre: 使用 OSM 矢量街道样式和 globe 投影 --
  var map = new maplibregl.Map({
    container: 'map',
    style: streetStyle,
    projection: 'globe',
    center: [120, 20],
    zoom: 2.8,
    minZoom: 2,
    maxZoom: 22,
    renderWorldCopies: true,
    fadeDuration: 0,
    refreshExpiredTiles: false,
    maxTileCacheSize: 64,
    dragRotate: false,
    touchPitch: false,
    attributionControl: false
  });

  // -- 地图控件 --
  map.addControl(new maplibregl.NavigationControl(), 'top-right');

  // ----------------------------------------------------------------
  //  绘制层管理
  // ----------------------------------------------------------------

  function addGraticuleLayer() {
    try { map.removeLayer('globe-graticule'); } catch(_) {}
    try { map.removeSource('globe-graticule'); } catch(_) {}

    var lines = [];
    for (var lon = -180; lon <= 180; lon += 30) {
      var meridian = [];
      for (var lat = -85; lat <= 85; lat += 5) meridian.push([lon, lat]);
      lines.push(meridian);
    }
    for (var lat = -60; lat <= 60; lat += 30) {
      var parallel = [];
      for (var lon = -180; lon <= 180; lon += 5) parallel.push([lon, lat]);
      lines.push(parallel);
    }
    map.addSource('globe-graticule', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'MultiLineString', coordinates: lines } }
    });
    map.addLayer({
      id: 'globe-graticule', type: 'line', source: 'globe-graticule',
      paint: {
        'line-color': '#65727d', 'line-width': 0.8,
        'line-opacity': 0.55, 'line-dasharray': [2, 2]
      }
    });
  }

  function simplifyLandStyle() {
    var layers = map.getStyle().layers || [];
    layers.forEach(function(layer) {
      var id = String(layer.id || '').toLowerCase();
      if (/(road|street|highway|transport|poi)/.test(id)) {
        try { map.setLayoutProperty(layer.id, 'visibility', 'none'); } catch(_) {}
      }
    });
  }

  function addDrawingLayers() {
    drawingSourceReady = false;
    // 先移除旧的绘制层（切换样式后 style.load 时会重建）
    try { map.removeLayer('draw-rect-outline'); } catch(_) {}
    try { map.removeLayer('draw-rect-fill'); } catch(_) {}
    try { map.removeSource('draw-rect-outline-source'); } catch(_) {}
    try { map.removeSource('draw-rect'); } catch(_) {}

    map.addSource('draw-rect', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });
    map.addSource('draw-rect-outline-source', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });
    map.addLayer({
      id: 'draw-rect-fill', type: 'fill', source: 'draw-rect',
      paint: { 'fill-color': '#6bbcff', 'fill-opacity': 0.16 }
    });
    map.addLayer({
      id: 'draw-rect-outline', type: 'line', source: 'draw-rect-outline-source',
      paint: { 'line-color': '#1677d2', 'line-width': 1.5, 'line-opacity': 0.95, 'line-blur': 0 }
    });
    drawingSourceReady = true;
    setStatus(text.ready, false);
  }

  // ----------------------------------------------------------------
  //  矩形绘制函数
  // ----------------------------------------------------------------

  function unwrapLongitude(longitude, reference) {
    var value = longitude;
    while (value - reference > 180) value -= 360;
    while (value - reference < -180) value += 360;
    return value;
  }

  function normalizedDrawLongitudes(east, west) {
    var drawWest = west;
    var drawEast = east;
    while (drawWest < -180) {
      drawWest += 360;
      drawEast += 360;
    }
    while (drawWest >= 180) {
      drawWest -= 360;
      drawEast -= 360;
    }
    return { west: drawWest, east: drawEast };
  }

  function rectangleGeometry(north, south, east, west) {
    var draw = normalizedDrawLongitudes(east, west);
    var drawWest = draw.west;
    var drawEast = draw.east;

    function ring(left, right) {
      return [[left, north], [right, north], [right, south], [left, south], [left, north]];
    }

    if (drawEast <= 180) {
      return { type: 'Polygon', coordinates: [ring(drawWest, drawEast)] };
    }

    return {
      type: 'MultiPolygon',
      coordinates: [
        [ring(drawWest, 180)],
        [ring(-180, drawEast - 360)]
      ]
    };
  }

  function rectangleOutlineGeometry(north, south, east, west) {
    var draw = normalizedDrawLongitudes(east, west);
    var drawWest = draw.west;
    var drawEast = draw.east;

    if (drawEast <= 180) {
      return {
        type: 'LineString',
        coordinates: [
          [drawWest, north], [drawEast, north], [drawEast, south],
          [drawWest, south], [drawWest, north]
        ]
      };
    }

    var wrappedEast = drawEast - 360;
    return {
      type: 'MultiLineString',
      coordinates: [
        [[drawWest, north], [180, north]],
        [[-180, north], [wrappedEast, north]],
        [[drawWest, south], [180, south]],
        [[-180, south], [wrappedEast, south]],
        [[drawWest, south], [drawWest, north]],
        [[wrappedEast, south], [wrappedEast, north]]
      ]
    };
  }

  function updateRectangle(north, south, east, west) {
    if (
      !drawingSourceReady
      || !map.getSource('draw-rect')
      || !map.getSource('draw-rect-outline-source')
    ) return false;
    try {
      map.getSource('draw-rect').setData({
        type: 'Feature',
        geometry: rectangleGeometry(north, south, east, west)
      });
      map.getSource('draw-rect-outline-source').setData({
        type: 'Feature',
        geometry: rectangleOutlineGeometry(north, south, east, west)
      });
    } catch(e) {
      setStatus(text.layerError, true);
      return false;
    }
    currentRect = { west: west, east: east, south: south, north: north };
    hasRect = true;
    return true;
  }

  function scheduleRectanglePreview(north, south, east, west) {
    previewBounds = { north: north, south: south, east: east, west: west };
    if (previewFrame !== null) return;
    previewFrame = window.requestAnimationFrame(function() {
      previewFrame = null;
      if (!previewBounds) return;
      var bounds = previewBounds;
      previewBounds = null;
      updateRectangle(bounds.north, bounds.south, bounds.east, bounds.west);
    });
  }

  function showCoords(west, east, south, north) {
    coordEls.west.textContent  = west.toFixed(3);
    coordEls.east.textContent  = east.toFixed(3);
    coordEls.south.textContent = south.toFixed(3);
    coordEls.north.textContent = north.toFixed(3);
    infoPanel.classList.add('visible');
    confirmBtn.disabled = false;
  }

  function clearRectangle() {
    try {
      map.getSource('draw-rect').setData({
        type: 'FeatureCollection',
        features: []
      });
      map.getSource('draw-rect-outline-source').setData({
        type: 'FeatureCollection',
        features: []
      });
    } catch(_) {}
    ['west','east','south','north'].forEach(function(k) { coordEls[k].textContent = '--'; });
    infoPanel.classList.remove('visible');
    currentRect = null;
    hasRect = false;
    confirmBtn.disabled = true;
  }

  function setTool(t) {
    tool = t;
    panBtn.classList.toggle('active', t === 'pan');
    rectBtn.classList.toggle('active', t === 'rect');
    if (t === 'pan') {
      map.dragPan.enable();
      map.getCanvas().style.cursor = '';
    } else {
      map.dragPan.disable();
      map.getCanvas().style.cursor = 'crosshair';
    }
  }

  // ----------------------------------------------------------------
  //  底图切换
  // ----------------------------------------------------------------

  function switchStyle(styleId) {
    if (styleId === currentStyle) return;
    currentStyle = styleId;
    attributionEl.textContent = RASTER_STYLES[styleId].attribution;
    clearRectangle();
    drawingSourceReady = false;
    // 切换底图时按钮保持可点击，但绘制会等图层准备好后再开始。
    rectBtn.disabled = false;

    if (styleId === 'street') {
      map.setStyle(
        typeof streetStyle === 'string' ? streetStyle : JSON.parse(JSON.stringify(streetStyle))
      );
    } else {
      map.setStyle({
        version: 8,
        sources: { 'base-tiles': RASTER_STYLES[styleId] },
        layers: [{ id: 'base-tiles-layer', type: 'raster', source: 'base-tiles' }]
      });
    }
    // 样式切换完成后重建绘制层
    map.once('style.load', function() {
      addDrawingLayers();
      rectBtn.disabled = false;
    });

    // 某些 QWebEngine / MapLibre 组合下 style.load 可能丢失，轮询样式状态兜底。
    function waitForStyleReady(attempt) {
      if (drawingSourceReady) return;
      if (map.isStyleLoaded && map.isStyleLoaded()) {
        addDrawingLayers();
        rectBtn.disabled = false;
        return;
      }
      if (attempt < 120) {
        window.setTimeout(function() { waitForStyleReady(attempt + 1); }, 50);
      } else {
        setStatus(text.styleTimeout, true);
      }
    }
    waitForStyleReady(0);
  }

  // ----------------------------------------------------------------
  //  map.on('load') — 确保地图与 GL 上下文就绪后再绑定交互
  // ----------------------------------------------------------------

  map.on('load', function() {
    addDrawingLayers();
    rectBtn.disabled = false;
    if (eventsBound) return;
    eventsBound = true;

    // 使用 MapLibre 的事件坐标，而不是 canvas 的 offsetX/offsetY。
    // QWebEngine 在高 DPI 或控件缩放时，offset 坐标可能与地图坐标不一致。
    map.on('mousedown', function(e) {
      if (tool !== 'rect' || !drawingSourceReady) return;
      e.preventDefault();
      isDrawing = true;
      startPoint = e.point;
      lastPoint = e.point;
      map.dragPan.disable();
    });

    map.on('mousemove', function(e) {
      if (!isDrawing || !startPoint || tool !== 'rect') return;
      lastPoint = e.point;
      var p = map.unproject(e.point);
      var start = map.unproject(startPoint);
      var endLongitude = unwrapLongitude(p.lng, start.lng);
      scheduleRectanglePreview(
        Math.max(start.lat, p.lat), Math.min(start.lat, p.lat),
        Math.max(start.lng, endLongitude), Math.min(start.lng, endLongitude)
      );
    });

    function finishDrawing(point) {
      if (!isDrawing || !startPoint || tool !== 'rect') return;
      var endPoint = point || lastPoint;
      if (!endPoint) return;
      isDrawing = false;
      if (previewFrame !== null) {
        window.cancelAnimationFrame(previewFrame);
        previewFrame = null;
      }
      previewBounds = null;
      var start = map.unproject(startPoint);
      var end = map.unproject(endPoint);
      var endLongitude = unwrapLongitude(end.lng, start.lng);
      var west = Math.min(start.lng, endLongitude);
      var east = Math.max(start.lng, endLongitude);
      var south = Math.min(start.lat, end.lat);
      var north = Math.max(start.lat, end.lat);
      if (updateRectangle(north, south, east, west)) {
        showCoords(west, east, south, north);
        setStatus(text.selected, false);
      }
      startPoint = null;
      lastPoint = null;
      setTool('pan');
    }

    map.on('mouseup', function(e) { finishDrawing(e.point); });
    window.addEventListener('mouseup', function() { finishDrawing(); });

    map.getCanvas().addEventListener('contextmenu', function(e) { e.preventDefault(); });
  });

  map.on('error', function(e) {
    var message = e && e.error && e.error.message ? e.error.message : '';
    setStatus(text.resourceError + message, true);
  });

  // ----------------------------------------------------------------
  //  Toolbar & 按钮事件
  // ----------------------------------------------------------------

  styleSelect.addEventListener('change', function(e) {
    switchStyle(e.target.value);
  });

  panBtn.addEventListener('click', function() {
    setTool('pan');
  });

  rectBtn.addEventListener('click', function() {
    if (rectBtn.disabled) return;
    if (!drawingSourceReady) {
      setStatus(text.styleLoading, false);
      return;
    }
    clearRectangle();
    setTool('rect');
    setStatus(text.drawing, false);
  });

  confirmBtn.addEventListener('click', function() {
    if (!hasRect || !currentRect) return;
    window.__globeResult = {
      west:  currentRect.west,
      east:  currentRect.east,
      south: currentRect.south,
      north: currentRect.north
    };
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && hasRect) confirmBtn.click();
  });
})();
</script>
</body>
</html>
