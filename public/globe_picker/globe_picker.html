<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>3D 地球选择区域</title>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js">
</script>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #map { width: 100%; height: 100%; }
  #polar-map {
    position: absolute; inset: 0; z-index: 1; display: none;
    width: 100%; height: 100%; background: #ffffff;
    touch-action: none; user-select: none;
  }
  #polar-map.visible { display: block; }
  #polar-nav {
    position: absolute; top: 12px; right: 12px; z-index: 12;
    display: none; overflow: hidden; border: 1px solid #c8c8c8; border-radius: 5px;
    background: rgba(255,255,255,0.94); box-shadow: 0 1px 4px rgba(0,0,0,0.18);
  }
  #polar-nav.visible { display: flex; flex-direction: column; }
  #polar-nav button {
    width: 30px; height: 30px; border: 0; border-bottom: 1px solid #d6d6d6;
    background: transparent; color: #333; font-size: 20px; line-height: 1;
    cursor: pointer;
  }
  #polar-nav button:last-child { border-bottom: 0; }
  #polar-nav button:hover { background: #f0f0f0; }
  #polar-map .polar-ocean { fill: #a9cfe1; stroke: #54859d; stroke-width: 1.2; }
  #polar-map .polar-graticule {
    fill: none; stroke: rgba(48, 100, 124, 0.56); stroke-width: 0.75;
  }
  #polar-map .polar-land { fill: #f7f5f1; stroke: #8c9ba2; stroke-width: 0.55; }
  #polar-map .polar-label {
    fill: #34454e; font-size: 11px; font-weight: 500;
    text-anchor: middle; paint-order: stroke; stroke: rgba(255,255,255,0.9); stroke-width: 3px;
  }
  #polar-map .polar-degree-label {
    fill: #38677d; font-size: 10px; text-anchor: middle;
    paint-order: stroke; stroke: rgba(230,241,246,0.95); stroke-width: 3px;
  }
  #polar-map .polar-region { stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  #polar-map .polar-point { fill: #26a269; stroke: #fff; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  #polar-map .polar-point-label {
    fill: #168451; font-size: 11px; font-weight: 600;
    paint-order: stroke; stroke: rgba(255,255,255,0.95); stroke-width: 3px;
  }

  /* Toolbar */
  #toolbar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(32, 32, 32, 0.88); backdrop-filter: blur(8px);
    border-radius: 10px; padding: 6px; display: flex; gap: 4px;
    align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    user-select: none; -webkit-user-select: none;
  }
  #toolbar button {
    padding: 6px 14px; border: none; border-radius: 6px; font-size: 13px;
    cursor: pointer; transition: all 0.15s;
  }
  #toolbar button {
    background: transparent; color: #ccc; min-width: 36px;
    display: flex; align-items: center; justify-content: center;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  #toolbar button.active { background: #4a90d9; color: #fff; }
  #toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #toolbar .mode-button {
    min-width: 76px; height: 32px; padding: 0 12px;
    border: 1px solid transparent; border-radius: 4px;
    font-size: 13px; font-weight: 400; white-space: nowrap;
  }
  #toolbar .mode-button.active { border-color: rgba(255,255,255,0.12); }
  #toolbar .separator { width: 1px; height: 24px; background: rgba(255,255,255,0.15); margin: 0 4px; }
  #point-tools { display: none; align-items: center; gap: 4px; }
  #point-tools.visible { display: flex; }
  #point-count {
    min-width: 54px; padding: 0 8px; color: #ddd; font-size: 12px;
    text-align: center; white-space: nowrap;
  }
  #point-tools #delete-point-btn { min-width: 56px; }
  #point-tools #confirm-points-btn { min-width: 76px; background: #237a4b; color: #fff; }
  #point-tools #confirm-points-btn:hover { background: #2b8f59; }
  .style-combo { position: relative; width: 158px; }
  #toolbar #style-select-button {
    width: 158px; height: 32px; padding: 0 10px;
    border: 1px solid #404040; border-radius: 4px;
    background: #2d2d2d; color: #fff;
    justify-content: space-between; gap: 10px;
    font-size: 13px; font-weight: 400; text-align: left;
  }
  #toolbar #style-select-button:hover,
  #toolbar #style-select-button[aria-expanded="true"] { background: #383838; }
  #style-select-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .combo-chevron {
    width: 7px; height: 7px; flex: 0 0 7px;
    border-right: 1.5px solid #d0d0d0; border-bottom: 1.5px solid #d0d0d0;
    transform: rotate(45deg) translate(-1px, -1px);
    transition: transform 0.15s ease;
  }
  #style-select-button[aria-expanded="true"] .combo-chevron {
    transform: rotate(225deg) translate(-1px, -1px);
  }
  #style-select-menu {
    position: absolute; top: 38px; left: 0; z-index: 30;
    display: none; width: 158px; padding: 4px;
    border: 1px solid #404040; border-radius: 6px;
    background: #2d2d2d; box-shadow: 0 8px 24px rgba(0,0,0,0.38);
  }
  #style-select-menu.visible { display: block; }
  #toolbar #style-select-menu .style-option {
    position: relative; width: 100%; min-height: 32px; padding: 6px 9px 6px 14px;
    border: 0; border-radius: 4px;
    justify-content: flex-start; color: #f2f2f2;
    background: transparent; font-size: 13px; font-weight: 400;
    text-align: left; white-space: nowrap; outline: none;
  }
  #toolbar #style-select-menu .style-option::before {
    content: ''; position: absolute; left: 3px; top: 50%;
    width: 3px; height: 0; border-radius: 2px;
    background: #0078d4; transform: translateY(-50%);
    transition: height 0.12s ease;
  }
  #toolbar #style-select-menu .style-option:hover,
  #toolbar #style-select-menu .style-option:focus-visible { background: #3d3d3d; }
  #toolbar #style-select-menu .style-option.selected {
    background: #353535;
  }
  #toolbar #style-select-menu .style-option.selected::before { height: 16px; }

  /* Info panel */
  #info-panel {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(32, 32, 32, 0.88); backdrop-filter: blur(8px);
    width: max-content; max-width: calc(100% - 32px); border-radius: 10px; padding: 12px 16px;
    display: none; align-items: center; justify-content: center; flex-wrap: nowrap;
    gap: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    color: #eee; font-size: 13px;
  }
  #info-panel.visible { display: flex; }
  #info-panel .coord-box { display: flex; align-items: center; text-align: center; }
  #info-panel .coord-box .label { margin-right: 6px; font-size: 11px; color: #999; }
  .coord-input {
    width: 88px; height: 30px; padding: 0 7px;
    border: none; border-radius: 4px;
    outline: none; background: #2d2d2d; color: #4fc3f7;
    text-align: center; font-size: 13px; font-weight: 600;
    font-family: 'SF Mono', 'Menlo', monospace;
  }
  .coord-input:focus { box-shadow: 0 0 0 1px #0078d4; }
  .coord-input.invalid { box-shadow: 0 0 0 1px #e25555; }
  .coord-input::-webkit-inner-spin-button,
  .coord-input::-webkit-outer-spin-button { appearance: none; margin: 0; }
  #status-panel {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    max-width: min(420px, calc(100% - 32px));
    padding: 8px 12px; border-radius: 6px;
    background: rgba(32, 32, 32, 0.82); color: #d8d8d8;
    font-size: 12px; box-shadow: 0 3px 14px rgba(0,0,0,0.25);
  }
  #status-panel.error { background: rgba(125, 35, 35, 0.92); color: #fff; }
  #region-legend {
    position: absolute; left: 16px; bottom: 18px; z-index: 10;
    display: none; min-width: 140px; max-width: min(300px, calc(100% - 32px));
    padding: 10px 12px; border-radius: 7px;
    background: rgba(32, 32, 32, 0.86); color: #eee;
    font-size: 12px; box-shadow: 0 3px 14px rgba(0,0,0,0.25);
  }
  #region-legend.visible { display: block; }
  .legend-item { display: flex; align-items: center; gap: 8px; min-height: 22px; }
  .legend-color { width: 18px; height: 3px; flex: 0 0 18px; border-radius: 1px; }
  .legend-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .point-marker {
    position: absolute; width: 12px; height: 12px; pointer-events: none;
    border: 2px solid #fff; border-radius: 50%;
    background: #26a269; box-shadow: 0 1px 5px rgba(0,0,0,0.65);
  }
  .point-marker-label {
    position: absolute; left: 14px; top: -6px; max-width: 150px;
    padding: 2px 5px; border-radius: 3px;
    background: rgba(38,162,105,0.92); color: #fff;
    font-size: 11px; line-height: 16px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; pointer-events: none;
  }
  #confirm-btn {
    padding: 7px 20px; border: none; border-radius: 6px; font-size: 13px;
    cursor: pointer; font-weight: 500; background: #27ae60; color: white;
  }
  #confirm-btn:hover { background: #219a52; }
  #confirm-btn:disabled { background: #444; color: #888; cursor: default; }
  #confirm-btn:disabled:hover { background: #444; }
  @media (max-width: 620px) {
    #info-panel { width: calc(100% - 32px); flex-wrap: wrap; }
  }
  .maplibregl-ctrl-top-right { top: 12px !important; right: 12px !important; }
  .maplibregl-ctrl-top-right .maplibregl-ctrl { margin: 0 0 4px 0; }
  #map-attribution {
    position: absolute; right: 8px; bottom: 6px; z-index: 9;
    padding: 2px 5px; border-radius: 3px;
    background: rgba(255,255,255,0.72); color: #4f5962;
    font-size: 10px; line-height: 1.3; pointer-events: none;
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="polar-map" aria-hidden="true"></div>
<div id="polar-nav" aria-hidden="true">
  <button id="polar-zoom-in" type="button" title="放大">+</button>
  <button id="polar-zoom-out" type="button" title="缩小">−</button>
</div>
<div id="status-panel">正在加载高清地图...</div>
<div id="map-attribution">OpenFreeMap · OpenMapTiles · OpenStreetMap · OpenSeaMap</div>
<div id="region-legend"></div>

<div id="toolbar">
  <div id="style-select" class="style-combo">
    <button id="style-select-button" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span id="style-select-label">行政区划海图</span>
      <span class="combo-chevron" aria-hidden="true"></span>
    </button>
    <div id="style-select-menu" role="listbox">
      <button class="style-option selected" type="button" role="option" data-value="administrative">行政区划海图</button>
      <button class="style-option" type="button" role="option" data-value="satellite">卫星图</button>
      <button class="style-option" type="button" role="option" data-value="dark">暗色图</button>
      <button class="style-option" type="button" role="option" data-value="light">亮色图</button>
      <button class="style-option" type="button" role="option" data-value="north_polar">北极地图</button>
      <button class="style-option" type="button" role="option" data-value="south_polar">南极地图</button>
    </div>
  </div>
  <div class="separator"></div>
  <button id="pan-btn" class="mode-button active" title="拖动地图">拖动地图</button>
  <button id="rect-btn" class="mode-button" title="框选区域" disabled>框选区域</button>
  <div id="point-tools">
    <div class="separator"></div>
    <span id="point-count">0</span>
    <button id="delete-point-btn" title="删除上一个点">撤销</button>
    <button id="confirm-points-btn">✓ 确认点位</button>
  </div>
</div>

<div id="info-panel">
  <div class="coord-box"><label class="label" id="label-west" for="west">西</label><input class="coord-input" id="west" type="number" min="-360" max="360" step="0.001" inputmode="decimal" /></div>
  <div class="coord-box"><label class="label" id="label-east" for="east">东</label><input class="coord-input" id="east" type="number" min="-360" max="360" step="0.001" inputmode="decimal" /></div>
  <div class="coord-box"><label class="label" id="label-south" for="south">南</label><input class="coord-input" id="south" type="number" min="-90" max="90" step="0.001" inputmode="decimal" /></div>
  <div class="coord-box"><label class="label" id="label-north" for="north">北</label><input class="coord-input" id="north" type="number" min="-90" max="90" step="0.001" inputmode="decimal" /></div>
  <button id="confirm-btn" disabled>✓ 确认</button>
</div>

<script>
(async function() {
  // -- 底图瓦片源 --
  var RASTER_STYLES = {
    administrative: {
      style: 'https://tiles.openfreemap.org/styles/bright',
      attribution: 'OpenFreeMap · OpenMapTiles · OpenStreetMap · OpenSeaMap'
    },
    satellite: {
      type: 'raster',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      tileSize: 256,
      attribution: '© Esri'
    },
    dark: {
      type: 'raster',
      tiles: ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'],
      tileSize: 256,
      attribution: '© CARTO'
    },
    light: {
      type: 'raster',
      tiles: ['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png'],
      tileSize: 256,
      attribution: '© CARTO'
    }
  };
  var MAP_TYPES = {
    administrative: { baseStyle: 'administrative' },
    satellite: { baseStyle: 'satellite' },
    dark: { baseStyle: 'dark' },
    light: { baseStyle: 'light' },
    north_polar: { baseStyle: 'polar', pole: 'north' },
    south_polar: { baseStyle: 'polar', pole: 'south' }
  };
  var queryParams = new URLSearchParams(window.location.search);
  var appLanguage = queryParams.get('lang') === 'en' ? 'en' : 'zh';
  var interactionMode = queryParams.get('mode') || 'select';
  var selectionEnabled = interactionMode === 'select';
  var pointSelectionEnabled = interactionMode === 'points';
  var pointDisplayEnabled = interactionMode === 'points-display';
  var UI_TEXT = {
    zh: {
      administrative: '行政区划海图', satellite: '卫星图', dark: '暗色图', light: '亮色图',
      north_polar: '北极地图', south_polar: '南极地图',
      pan: '拖动地图', rectangle: '框选区域', confirm: '确认',
      west: '西', east: '东', south: '南', north: '北',
      loading: '正在加载高清地图...', engineError: '地图引擎加载失败，请检查网络连接后重试。',
      ready: '地图已就绪，可拖动地球或点击矩形按钮选择范围。',
      polarLoading: '正在加载极区投影地图...', polarReady: '极区地图已就绪，可缩放、拖动或框选区域。',
      polarError: '极区地图加载失败，请检查网络连接后重试。',
      layerError: '矩形图层更新失败，请重新选择底图后重试。',
      styleLoading: '底图正在加载，请稍候再选择矩形。',
      styleTimeout: '底图仍在加载，请稍候再选择矩形。',
      initialBounds: '已显示当前网格范围，可点击矩形按钮重新选择。',
      invalidCoordinates: '请输入有效范围：经度 -360～360、纬度 -90～90，且西 < 东、南 < 北，经度跨度不超过 360°。',
      displayingRegions: '已显示 {count} 个强迫场范围。',
      pointReady: '点击地图添加点位，拖动地图可平移。',
      displayingPoints: '已显示 {count} 个二维谱点位。',
      pointCount: '{count} 个点', undoPoint: '撤销', deletePoint: '删除上一个点', confirmPoints: '确认点位',
      pointOutside: '该位置不在网格范围内。', duplicatePoint: '该位置已有点位。',
      selected: '已选择区域，再次点击矩形按钮可重新选择。',
      drawing: '请在地图上拖动鼠标绘制矩形。', resourceError: '地图资源加载异常：'
    },
    en: {
      administrative: 'Administrative chart', satellite: 'Satellite', dark: 'Dark', light: 'Light',
      north_polar: 'North polar map', south_polar: 'South polar map',
      pan: 'Pan map', rectangle: 'Select region', confirm: 'Confirm',
      west: 'W', east: 'E', south: 'S', north: 'N',
      loading: 'Loading high-resolution map...', engineError: 'Map engine failed to load. Check the network and retry.',
      ready: 'Map ready. Pan the globe or draw a rectangular region.',
      polarLoading: 'Loading polar projection map...', polarReady: 'Polar map ready. Zoom, pan, or select a region.',
      polarError: 'Polar map failed to load. Check the network and retry.',
      layerError: 'Rectangle layer failed to update. Switch the map style and retry.',
      styleLoading: 'The map style is loading. Please wait before drawing.',
      styleTimeout: 'The map style is still loading. Please try again shortly.',
      initialBounds: 'Current grid bounds are displayed. Click the rectangle button to redraw.',
      invalidCoordinates: 'Enter a valid region: longitude -360 to 360, latitude -90 to 90, west < east, south < north, and longitude span no greater than 360°.',
      displayingRegions: 'Displaying {count} forcing-field region(s).',
      pointReady: 'Click the map to add points. Drag to pan.',
      displayingPoints: 'Displaying {count} spectral point(s).',
      pointCount: '{count} point(s)', undoPoint: 'Undo', deletePoint: 'Delete last point', confirmPoints: 'Confirm points',
      pointOutside: 'This location is outside the grid region.', duplicatePoint: 'A point already exists here.',
      selected: 'Region selected. Click the rectangle button to redraw.',
      drawing: 'Drag on the map to draw a rectangle.', resourceError: 'Map resource error: '
    }
  };
  var text = UI_TEXT[appLanguage];

  function readInitialBounds(params) {
    var bounds = {
      west: Number(params.get('west')),
      east: Number(params.get('east')),
      south: Number(params.get('south')),
      north: Number(params.get('north'))
    };
    if (!['west', 'east', 'south', 'north'].every(function(key) {
      return params.has(key) && Number.isFinite(bounds[key]);
    })) return null;
    if (bounds.south >= bounds.north || bounds.south < -90 || bounds.north > 90) return null;
    while (bounds.east <= bounds.west) bounds.east += 360;
    if (bounds.east - bounds.west > 360) return null;
    return bounds;
  }

  var initialBounds = readInitialBounds(queryParams);
  var initialBoundsApplied = false;

  function readDisplayRegions(params) {
    var raw = params.get('regions');
    if (!raw) return [];
    var parsed;
    try { parsed = JSON.parse(raw); } catch (_) { return []; }
    if (!Array.isArray(parsed)) return [];
    return parsed.filter(function(region) {
      if (!region || typeof region !== 'object') return false;
      ['west', 'east', 'south', 'north'].forEach(function(key) {
        region[key] = Number(region[key]);
      });
      if (!['west', 'east', 'south', 'north'].every(function(key) {
        return Number.isFinite(region[key]);
      })) return false;
      while (region.east <= region.west) region.east += 360;
      return region.south < region.north
        && region.south >= -90
        && region.north <= 90
        && region.east - region.west <= 360;
    });
  }

  var displayRegions = readDisplayRegions(queryParams);

  function readJsonObject(params, key) {
    var raw = params.get(key);
    if (!raw) return null;
    try {
      var value = JSON.parse(raw);
      return value && typeof value === 'object' ? value : null;
    } catch (_) { return null; }
  }

  function readPoints(params) {
    var parsed = readJsonObject(params, 'points');
    if (!Array.isArray(parsed)) return [];
    return parsed.filter(function(point) {
      point.lon = Number(point.lon);
      point.lat = Number(point.lat);
      return Number.isFinite(point.lon) && Number.isFinite(point.lat)
        && point.lat >= -90 && point.lat <= 90;
    });
  }

  var pointBounds = readJsonObject(queryParams, 'pointBounds');
  var selectedPoints = readPoints(queryParams);
  var pointMarkers = [];

  // -- 状态 --
  var tool = 'pan';          // 'pan' | 'rect'
  var isDrawing = false;
  var startPoint = null;
  var currentRect = null;
  var hasRect = false;
  var currentStyle = 'administrative';
  var drawingSourceReady = false;
  var eventsBound = false;
  var lastPoint = null;
  var previewBounds = null;
  var previewFrame = null;
  var polarWorld = null;
  var polarProjection = null;
  var polarPath = null;
  var polarRoot = null;
  var polarZoom = null;
  var polarZoomTransform = null;
  var polarDrawStart = null;
  var polarLastPointer = null;
  var polarTileMap = null;
  var polarTileScriptPromise = null;

  // -- DOM 引用 --
  var coordEls = {
    west: document.getElementById('west'),
    east: document.getElementById('east'),
    south: document.getElementById('south'),
    north: document.getElementById('north')
  };
  var mapElement = document.getElementById('map');
  var polarMapElement = document.getElementById('polar-map');
  var polarNav = document.getElementById('polar-nav');
  var polarZoomIn = document.getElementById('polar-zoom-in');
  var polarZoomOut = document.getElementById('polar-zoom-out');
  var infoPanel = document.getElementById('info-panel');
  var confirmBtn = document.getElementById('confirm-btn');
  var panBtn = document.getElementById('pan-btn');
  var rectBtn = document.getElementById('rect-btn');
  var styleSelect = document.getElementById('style-select');
  var styleSelectButton = document.getElementById('style-select-button');
  var styleSelectLabel = document.getElementById('style-select-label');
  var styleSelectMenu = document.getElementById('style-select-menu');
  var styleOptions = Array.prototype.slice.call(document.querySelectorAll('.style-option'));
  var statusPanel = document.getElementById('status-panel');
  var attributionEl = document.getElementById('map-attribution');
  var regionLegend = document.getElementById('region-legend');
  var pointTools = document.getElementById('point-tools');
  var pointCount = document.getElementById('point-count');
  var deletePointBtn = document.getElementById('delete-point-btn');
  var confirmPointsBtn = document.getElementById('confirm-points-btn');

  var gestureZoomDelta = 0;
  var gestureZoomFrame = null;

  function applyGestureZoom() {
    gestureZoomFrame = null;
    var delta = gestureZoomDelta;
    gestureZoomDelta = 0;

    if (map && map.isStyleLoaded()) {
      map.easeTo({ zoom: map.getZoom() + delta, duration: 80 });
    }
  }

    var optimized = JSON.parse(JSON.stringify(style));
    optimized.layers = (optimized.layers || []).filter(function(layer) {
      var id = String(layer.id || '');
      return /^(background|water$|water-intermittent|landcover-glacier|boundary_|label_|water_name_|ferry$|road_area_pier$|road_pier$)/i.test(id);
    });
    var labelExpression = appLanguage === 'en'
      ? ['get', 'name:en']
      : ['coalesce', ['get', 'name:zh-Hans'], ['get', 'name:zh'], ['get', 'name:en']];
    optimized.layers.forEach(function(layer) {
      if (layer.id === 'boundary_3') {
        layer.filter = [
          'all', ['>=', ['get', 'admin_level'], 3], ['<=', ['get', 'admin_level'], 10],
          ['!=', ['get', 'maritime'], 1], ['!=', ['get', 'disputed'], 1],
          ['!', ['has', 'claimed_by']]
        ];
      }
      if (layer.id === 'label_other') {
        layer.filter = [
          'match', ['get', 'class'],
          ['province', 'borough', 'county', 'district', 'suburb'], true, false
        ];

      if (layer.id === 'ferry') {
        layer.paint = {
          'line-color': '#1684ad',

          'line-opacity': 0.9,

      if (layer.type !== 'symbol' || !layer.layout || layer.layout['text-field'] == null) return;
      if (JSON.stringify(layer.layout['text-field']).toLowerCase().indexOf('name') === -1) return;
      layer.layout['text-field'] = labelExpression;
    });
    var labelIndex = optimized.layers.findIndex(function(layer) {
      return String(layer.id || '').indexOf('label_') === 0;
    });
    optimized.layers.splice(labelIndex < 0 ? optimized.layers.length : labelIndex, 0, {

  async function ensurePolarWorld() {
    if (polarWorld) return;
    if (!polarLibraryPromise) {
      polarLibraryPromise = Promise.all([
        loadExternalScript('https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js', 'd3'),

          'https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js', 'topojson'
        )
      ]);
    }
    try {
      await polarLibraryPromise;

      cache: 'force-cache'

    if (!response.ok) throw new Error('HTTP ' + response.status);

  function polarPointVisible(lonLat) {
    if (!lonLat) return false;
    return mapTypeConfig(currentStyle).pole === 'north' ? lonLat[1] >= 45 : lonLat[1] <= -45;
  }

  function polarPointerLonLat(event) {
    if (polarTileMap) return polarTileMap.eventLonLat(event);
    if (!polarProjection || !polarZoomTransform) return null;
    var bounds = polarMapElement.getBoundingClientRect();
    var point = [event.clientX - bounds.left, event.clientY - bounds.top];
    var projectedPoint = polarZoomTransform.invert(point);
    var lonLat = polarProjection.invert(projectedPoint);
    return polarPointVisible(lonLat) ? lonLat : null;
  }

  function degreeLabel(longitude) {
    if (longitude === 0) return '0°';
    if (Math.abs(longitude) === 180) return '180°';
    return Math.abs(longitude) + '°' + (longitude < 0 ? 'W' : 'E');
  }

  function renderPolarOverlays() {
    if (polarTileMap) {
      var tileRegions = selectionEnabled && currentRect ? [currentRect] : displayRegions;
      polarTileMap.render(tileRegions, selectedPoints, polarRectangleGeometry);
      return;
    }
    if (!polarRoot || !polarPath) return;
    var regionLayer = polarRoot.select('.polar-regions');
    var pointLayer = polarRoot.select('.polar-points');
    regionLayer.selectAll('*').remove();
    pointLayer.selectAll('*').remove();

    var regions = selectionEnabled && currentRect ? [currentRect] : displayRegions;
    regions.forEach(function(region) {
      var color = region.color || '#1677d2';
      regionLayer.append('path')
        .attr('class', 'polar-region')
        .attr('d', polarPath({ type: 'Feature', geometry: polarRectangleGeometry(
          region.north, region.south, region.east, region.west
        ) }))
        .attr('fill', color)
        .attr('fill-opacity', selectionEnabled ? 0.16 : 0.12)
        .attr('stroke', color)
        .attr('stroke-width', region.width || 1.5);
    });

    selectedPoints.forEach(function(point, index) {
      var lonLat = [Number(point.lon), Number(point.lat)];
      if (!polarPointVisible(lonLat)) return;
      var position = polarProjection(lonLat);
      var marker = pointLayer.append('g').attr('transform', 'translate(' + position.join(',') + ')');
      marker.append('circle').attr('class', 'polar-point').attr('r', 5);
      marker.append('text')
        .attr('class', 'polar-point-label')
        .attr('x', 8).attr('y', 4)
        .text(String(point.name || index));
    });
  }

  function renderPolarMap() {
    var width = Math.max(320, polarMapElement.clientWidth);
    var height = Math.max(260, polarMapElement.clientHeight);
    var pole = mapTypeConfig(currentStyle).pole;
    var radius = Math.min(width, height) * 0.43;
    polarProjection = d3.geoAzimuthalEquidistant()
      .rotate(pole === 'north' ? [0, -90] : [0, 90])
      .clipAngle(45.0001)
      .scale(radius / (Math.PI / 4))
      .translate([width / 2, height / 2])
      .precision(0.2);
    polarPath = d3.geoPath(polarProjection);

    var svg = d3.select(polarMapElement);
    svg.selectAll('*').remove();
    svg.attr('viewBox', '0 0 ' + width + ' ' + height);
    polarRoot = svg.append('g');
    polarRoot.append('path').datum({ type: 'Sphere' }).attr('class', 'polar-ocean').attr('d', polarPath);
    var graticule = d3.geoGraticule()
      .extent(pole === 'north' ? [[-180, 45], [180, 89.999]] : [[-180, -89.999], [180, -45]])
      .step([30, 10]);
    polarRoot.append('path').datum(graticule()).attr('class', 'polar-graticule').attr('d', polarPath);
    polarRoot.append('g').selectAll('path')
      .data(polarWorld.features)
      .join('path')
      .attr('class', 'polar-land')
      .attr('d', polarPath);

    var labelLatitude = pole === 'north' ? 46.2 : -46.2;
    polarRoot.append('g').selectAll('text')
      .data(d3.range(-150, 181, 30))
      .join('text')
      .attr('class', 'polar-degree-label')
      .attr('x', function(longitude) { return polarProjection([longitude, labelLatitude])[0]; })
      .attr('y', function(longitude) { return polarProjection([longitude, labelLatitude])[1] + 3; })
      .text(degreeLabel);

    polarRoot.append('g').selectAll('text')
      .data(POLAR_LABELS[pole])
      .join('text')
      .attr('class', 'polar-label')
      .attr('x', function(label) { return polarProjection([label.lon, label.lat])[0]; })

    polarRoot.append('g').attr('class', 'polar-regions');
    polarRoot.append('g').attr('class', 'polar-points');

    polarZoomTransform = d3.zoomIdentity;
    polarZoom = d3.zoom().scaleExtent([1, 8]).on('zoom', function(event) {
      polarZoomTransform = event.transform;
      polarRoot.attr('transform', event.transform);
    });
    svg.call(polarZoom).on('dblclick.zoom', null);
    renderPolarOverlays();
    setTool(tool);
  }

  // ----------------------------------------------------------------
  //  矩形绘制函数
  // ----------------------------------------------------------------

  function unwrapLongitude(longitude, reference) {
    var value = longitude;
    while (value - reference > 180) value -= 360;
    while (value - reference < -180) value += 360;
    return value;
  }

  function normalizedDrawLongitudes(east, west) {
    var drawWest = west;
    var drawEast = east;
    while (drawWest < -180) {
      drawWest += 360;
      drawEast += 360;
    }
    while (drawWest >= 180) {
      drawWest -= 360;
      drawEast -= 360;
    }
    return { west: drawWest, east: drawEast };
  }

  function rectangleGeometry(north, south, east, west) {
    var draw = normalizedDrawLongitudes(east, west);
    var drawWest = draw.west;
    var drawEast = draw.east;

    function ring(left, right) {
      return [[left, north], [right, north], [right, south], [left, south], [left, north]];
    }

    if (drawEast <= 180) {
      return { type: 'Polygon', coordinates: [ring(drawWest, drawEast)] };
    }

    return {
      type: 'MultiPolygon',
      coordinates: [
        [ring(drawWest, 180)],
        [ring(-180, drawEast - 360)]
      ]
    };
  }

  function rectangleOutlineGeometry(north, south, east, west) {
    var draw = normalizedDrawLongitudes(east, west);
    var drawWest = draw.west;
    var drawEast = draw.east;

    if (drawEast <= 180) {
      return {
        type: 'LineString',
        coordinates: [
          [drawWest, north], [drawEast, north], [drawEast, south],
          [drawWest, south], [drawWest, north]
        ]
      };
    }

    var wrappedEast = drawEast - 360;
    return {
      type: 'MultiLineString',
      coordinates: [
        [[drawWest, north], [180, north]],
        [[-180, north], [wrappedEast, north]],
        [[drawWest, south], [180, south]],
        [[-180, south], [wrappedEast, south]],
        [[drawWest, south], [drawWest, north]],
        [[wrappedEast, south], [wrappedEast, north]]
      ]
    };
  }

  function polarRectangleGeometry(north, south, east, west) {
    var draw = normalizedDrawLongitudes(east, west);
    var drawWest = draw.west;
    var drawEast = draw.east;

    function ring(left, right) {
      var coordinates = [];
      var longitudeSteps = Math.max(1, Math.ceil((right - left) / 2));
      var latitudeSteps = Math.max(1, Math.ceil((north - south) / 2));
      var index;
      for (index = 0; index <= longitudeSteps; index += 1) {
        coordinates.push([left + (right - left) * index / longitudeSteps, north]);
      }
      for (index = 1; index <= latitudeSteps; index += 1) {
        coordinates.push([right, north + (south - north) * index / latitudeSteps]);
      }
      for (index = 1; index <= longitudeSteps; index += 1) {
        coordinates.push([right + (left - right) * index / longitudeSteps, south]);
      }
      for (index = 1; index <= latitudeSteps; index += 1) {
        coordinates.push([left, south + (north - south) * index / latitudeSteps]);
      }
      return coordinates;
    }

    if (drawEast <= 180) return { type: 'Polygon', coordinates: [ring(drawWest, drawEast)] };
    return {
      type: 'MultiPolygon',
      coordinates: [
        [ring(drawWest, 180)],
        [ring(-180, drawEast - 360)]
      ]
    };
  }

  function updateRectangle(north, south, east, west) {
    if (isPolarActive()) {
      if (!drawingSourceReady || (!polarTileMap && !polarRoot)) return false;
      currentRect = { west: west, east: east, south: south, north: north };
      hasRect = true;
      renderPolarOverlays();
      return true;
    }
    if (
      !drawingSourceReady
      || !map.getSource('draw-rect')
      || !map.getSource('draw-rect-outline-source')
    ) return false;
    try {
      map.getSource('draw-rect').setData({
        type: 'Feature',
        geometry: rectangleGeometry(north, south, east, west)
      });
      map.getSource('draw-rect-outline-source').setData({
        type: 'Feature',
        geometry: rectangleOutlineGeometry(north, south, east, west)
      });
    } catch(e) {
      setStatus(text.layerError, true);
      return false;
    }
    currentRect = { west: west, east: east, south: south, north: north };
    hasRect = true;
    return true;
  }

  function scheduleRectanglePreview(north, south, east, west) {
    previewBounds = { north: north, south: south, east: east, west: west };
    if (previewFrame !== null) return;
    previewFrame = window.requestAnimationFrame(function() {
      previewFrame = null;
      if (!previewBounds) return;
      var bounds = previewBounds;
      previewBounds = null;
      updateRectangle(bounds.north, bounds.south, bounds.east, bounds.west);
    });
  }

  function showCoords(west, east, south, north) {
    coordEls.west.value  = west.toFixed(3);
    coordEls.east.value  = east.toFixed(3);
    coordEls.south.value = south.toFixed(3);
    coordEls.north.value = north.toFixed(3);
    Object.keys(coordEls).forEach(function(key) { coordEls[key].classList.remove('invalid'); });
    infoPanel.classList.add('visible');
    confirmBtn.disabled = false;
  }

  function readCoordinateInputs() {
    var values = {
      west: Number(coordEls.west.value),
      east: Number(coordEls.east.value),
      south: Number(coordEls.south.value),
      north: Number(coordEls.north.value)
    };
    var valid = true;
    Object.keys(values).forEach(function(key) {
      var value = values[key];
      var limit = key === 'south' || key === 'north' ? 90 : 360;
      var fieldValid = coordEls[key].value.trim() !== ''
        && Number.isFinite(value)
        && value >= -limit
        && value <= limit;
      coordEls[key].classList.toggle('invalid', !fieldValid);
      valid = valid && fieldValid;
    });
    if (valid && (values.east <= values.west || values.east - values.west > 360)) {
      coordEls.west.classList.add('invalid');
      coordEls.east.classList.add('invalid');
      valid = false;
    }
    if (valid && values.north <= values.south) {
      coordEls.south.classList.add('invalid');
      coordEls.north.classList.add('invalid');
      valid = false;
    }
    confirmBtn.disabled = !valid;
    return valid ? values : null;
  }

  function applyCoordinateInputs() {
    var values = readCoordinateInputs();
    if (!values) {
      setStatus(text.invalidCoordinates, true);
      return false;
    }
    if (!updateRectangle(values.north, values.south, values.east, values.west)) return false;
    setStatus(text.selected, false);
    return true;
  }

  function applyInitialBounds() {
    if (initialBoundsApplied || !initialBounds || !drawingSourceReady) return;
    if (!updateRectangle(
      initialBounds.north,
      initialBounds.south,
      initialBounds.east,
      initialBounds.west
    )) return;

    initialBoundsApplied = true;
    showCoords(
      initialBounds.west,
      initialBounds.east,
      initialBounds.south,
      initialBounds.north
    );
    setStatus(text.initialBounds, false);

    if (isPolarActive()) return;
    var draw = normalizedDrawLongitudes(initialBounds.east, initialBounds.west);
    map.fitBounds(
      [[draw.west, initialBounds.south], [draw.east, initialBounds.north]],
      {
        padding: { top: 80, right: 80, bottom: 100, left: 80 },
        duration: 0,
        maxZoom: 8
      }
    );
  }

  function applyDisplayRegions() {
    if (selectionEnabled || !drawingSourceReady) return;
    if (isPolarActive()) {
      renderPolarOverlays();
      renderRegionLegend();
      updatePointTools();
      if (pointSelectionEnabled) setStatus(text.pointReady, false);
      else if (pointDisplayEnabled) {
        setStatus(text.displayingPoints.replace('{count}', String(selectedPoints.length)), false);
      } else {
        setStatus(text.displayingRegions.replace('{count}', String(displayRegions.length)), false);
      }
      return;
    }
    var fillFeatures = [];
    var outlineFeatures = [];
    displayRegions.forEach(function(region) {
      var properties = {
        color: region.color || '#1687d9',
        opacity: 0.12,
        width: 2
      };
      fillFeatures.push({
        type: 'Feature',
        properties: properties,
        geometry: rectangleGeometry(region.north, region.south, region.east, region.west)
      });
      outlineFeatures.push({
        type: 'Feature',
        properties: properties,
        geometry: rectangleOutlineGeometry(region.north, region.south, region.east, region.west)
      });
    });
    map.getSource('draw-rect').setData({ type: 'FeatureCollection', features: fillFeatures });
    map.getSource('draw-rect-outline-source').setData({
      type: 'FeatureCollection', features: outlineFeatures
    });
    renderRegionLegend();
    if (displayRegions.length > 0) fitDisplayRegions();
    if (pointSelectionEnabled) {
      renderPointMarkers();
      setStatus(text.pointReady, false);
    } else if (pointDisplayEnabled) {
      renderPointMarkers();
      if (displayRegions.length === 0) fitDisplayPoints();
      setStatus(text.displayingPoints.replace('{count}', String(selectedPoints.length)), false);
    } else {
      setStatus(text.displayingRegions.replace('{count}', String(displayRegions.length)), false);
    }
  }

  function updatePointTools() {
    pointCount.textContent = text.pointCount.replace('{count}', String(selectedPoints.length));
    deletePointBtn.disabled = selectedPoints.length === 0;
    confirmPointsBtn.disabled = false;
  }

  function renderPointMarkers() {
    pointMarkers.forEach(function(marker) { marker.remove(); });
    pointMarkers = [];
    selectedPoints.forEach(function(point, index) {
      var markerElement = document.createElement('div');
      markerElement.className = 'point-marker';
      var label = document.createElement('span');
      label.className = 'point-marker-label';
      label.textContent = String(point.name || index);
      markerElement.appendChild(label);
      pointMarkers.push(
        new maplibregl.Marker({ element: markerElement, anchor: 'center' })
          .setLngLat([point.lon, point.lat])
          .addTo(map)
      );
    });
    if (isPolarActive()) renderPolarOverlays();
    updatePointTools();
  }

  function longitudeForPointBounds(longitude) {
    if (!pointBounds) return longitude;
    var value = longitude;
    while (value < Number(pointBounds.west)) value += 360;
    while (value >= Number(pointBounds.west) + 360) value -= 360;
    return value;
  }

  function pointInsideBounds(longitude, latitude) {
    if (!pointBounds) return true;
    var west = Number(pointBounds.west);
    var east = Number(pointBounds.east);
    var south = Number(pointBounds.south);
    var north = Number(pointBounds.north);
    if (![west, east, south, north].every(Number.isFinite)) return true;
    while (east <= west) east += 360;
    var lon = longitudeForPointBounds(longitude);
    return lon >= west - 1e-6 && lon <= east + 1e-6
      && latitude >= south - 1e-6 && latitude <= north + 1e-6;
  }

  function addSelectedPoint(lngLat) {
    var longitude = longitudeForPointBounds(lngLat.lng);
    var latitude = Number(lngLat.lat);
    if (!pointInsideBounds(longitude, latitude)) {
      setStatus(text.pointOutside, true);
      return;
    }
    var duplicate = selectedPoints.some(function(point) {
      return Math.abs(point.lon - longitude) < 1e-3 && Math.abs(point.lat - latitude) < 1e-3;
    });
    if (duplicate) {
      setStatus(text.duplicatePoint, true);
      return;
    }
    var usedNames = selectedPoints.reduce(function(result, point) {
      result[String(point.name || '')] = true;
      return result;
    }, {});
    var nextName = selectedPoints.length;
    while (usedNames[String(nextName)]) nextName += 1;
    selectedPoints.push({
      lon: longitude,
      lat: latitude,
      name: String(nextName)
    });
    renderPointMarkers();
    setStatus(text.pointReady, false);
  }

  function renderRegionLegend() {
    regionLegend.textContent = '';
    displayRegions.forEach(function(region) {
      var item = document.createElement('div');
      item.className = 'legend-item';
      var color = document.createElement('span');
      color.className = 'legend-color';
      color.style.backgroundColor = region.color || '#1687d9';
      var label = document.createElement('span');
      label.className = 'legend-label';
      label.textContent = String(region.label || '');
      item.appendChild(color);
      item.appendChild(label);
      regionLegend.appendChild(item);
    });
    regionLegend.classList.toggle('visible', displayRegions.length > 0);
  }

  function fitDisplayRegions() {
    var reference = (displayRegions[0].west + displayRegions[0].east) / 2;
    var west = Infinity;
    var east = -Infinity;
    var south = Infinity;
    var north = -Infinity;
    displayRegions.forEach(function(region) {
      var drawWest = region.west;
      var drawEast = region.east;
      var center = (drawWest + drawEast) / 2;
      while (center - reference > 180) {
        drawWest -= 360;
        drawEast -= 360;
        center -= 360;
      }
      while (center - reference < -180) {
        drawWest += 360;
        drawEast += 360;
        center += 360;
      }
      west = Math.min(west, drawWest);
      east = Math.max(east, drawEast);
      south = Math.min(south, region.south);
      north = Math.max(north, region.north);
    });
    if (east - west > 360) {
      west = -180;
      east = 180;
    }
    map.fitBounds([[west, south], [east, north]], {
      padding: { top: 90, right: 90, bottom: 90, left: 90 },
      duration: 0,
      maxZoom: 8
    });
  }

  function fitDisplayPoints() {
    if (selectedPoints.length === 0) return;
    var reference = selectedPoints[0].lon;
    var longitudes = selectedPoints.map(function(point) {
      return unwrapLongitude(point.lon, reference);
    });
    var west = Math.min.apply(null, longitudes);
    var east = Math.max.apply(null, longitudes);
    var south = Math.min.apply(null, selectedPoints.map(function(point) { return point.lat; }));
    var north = Math.max.apply(null, selectedPoints.map(function(point) { return point.lat; }));
    var lonPadding = Math.max((east - west) * 0.12, 1.5);
    var latPadding = Math.max((north - south) * 0.12, 1.5);
    map.fitBounds(
      [[west - lonPadding, Math.max(-90, south - latPadding)],
       [east + lonPadding, Math.min(90, north + latPadding)]],
      {
        padding: { top: 90, right: 90, bottom: 90, left: 90 },
        duration: 0,
        maxZoom: 8
      }
    );
  }

  function clearRectangle() {
    try {
      map.getSource('draw-rect').setData({
        type: 'FeatureCollection',
        features: []
      });
      map.getSource('draw-rect-outline-source').setData({
        type: 'FeatureCollection',
        features: []
      });
    } catch(_) {}
    ['west','east','south','north'].forEach(function(k) {
      coordEls[k].value = '';
      coordEls[k].classList.remove('invalid');
    });
    infoPanel.classList.remove('visible');
    currentRect = null;
    hasRect = false;
    confirmBtn.disabled = true;
    if (isPolarActive()) renderPolarOverlays();
  }

  function setTool(t) {
    tool = t;
    panBtn.classList.toggle('active', t === 'pan');
    rectBtn.classList.toggle('active', t === 'rect');
    if (isPolarActive()) {
      polarMapElement.style.cursor = t === 'pan'
        ? (pointSelectionEnabled ? 'default' : 'grab')
        : 'crosshair';
      if (polarTileMap) {
        polarTileMap.setTool(t);
        return;
      }
      if (polarZoom) {
        polarZoom.filter(function(event) {
          return tool === 'pan' && !event.ctrlKey && !event.button;
        });
      }
      return;
    }
    if (t === 'pan') {
      map.dragPan.enable();
      map.getCanvas().style.cursor = '';
    } else {
      map.dragPan.disable();
      map.getCanvas().style.cursor = 'crosshair';
    }
  }

  // ----------------------------------------------------------------
  //  底图切换
  // ----------------------------------------------------------------

  function switchStyle(styleId) {
    if (!MAP_TYPES[styleId]) return;
    styleSelectLabel.textContent = text[styleId];
    styleOptions.forEach(function(option) {
      var selected = option.dataset.value === styleId;
      option.classList.toggle('selected', selected);
      option.setAttribute('aria-selected', selected ? 'true' : 'false');
    });
    if (styleId === currentStyle) return;
    var previousStyleId = currentStyle;
    currentStyle = styleId;
    if (navigationOverlayTimer !== null) {
      window.clearTimeout(navigationOverlayTimer);
      navigationOverlayTimer = null;
    }
    if (isPolarMap(styleId)) {
      activatePolarMap(styleId);
      return;
    }
    if (isPolarMap(previousStyleId)) deactivatePolarMap();
    var targetBaseStyle = baseStyleId(styleId);
    attributionEl.textContent = RASTER_STYLES[targetBaseStyle].attribution;
    drawingSourceReady = false;
    // 切换底图时按钮保持可点击，但绘制会等图层准备好后再开始。
    rectBtn.disabled = false;

    if (targetBaseStyle === 'administrative') {
      map.setStyle(
        typeof administrativeStyle === 'string'
          ? administrativeStyle
          : JSON.parse(JSON.stringify(administrativeStyle))
      );
    } else {
      map.setStyle({
        version: 8,
        sources: { 'base-tiles': RASTER_STYLES[targetBaseStyle] },
        layers: [{ id: 'base-tiles-layer', type: 'raster', source: 'base-tiles' }]
      });
    }
    // 样式切换完成后重建绘制层
    map.once('style.load', function() {
      if (styleId !== currentStyle) return;
      addDrawingLayers();
      if (targetBaseStyle === 'administrative') scheduleNavigationOverlay();
      rectBtn.disabled = false;
    });

    // 某些 QWebEngine / MapLibre 组合下 style.load 可能丢失，轮询样式状态兜底。
    function waitForStyleReady(attempt) {
      if (styleId !== currentStyle) return;
      if (drawingSourceReady) return;
      if (map.isStyleLoaded && map.isStyleLoaded()) {
        addDrawingLayers();
        if (targetBaseStyle === 'administrative') scheduleNavigationOverlay();
        rectBtn.disabled = false;
        return;
      }
      if (attempt < 120) {
        window.setTimeout(function() { waitForStyleReady(attempt + 1); }, 50);
      } else {
        setStatus(text.styleTimeout, true);
      }
    }
    waitForStyleReady(0);
  }

  // ----------------------------------------------------------------
  //  map.on('load') — 确保地图与 GL 上下文就绪后再绑定交互
  // ----------------------------------------------------------------

  map.on('load', function() {
    addDrawingLayers();
    scheduleNavigationOverlay();
    rectBtn.disabled = false;
    if (eventsBound) return;
    eventsBound = true;

    // 使用 MapLibre 的事件坐标，而不是 canvas 的 offsetX/offsetY。
    // QWebEngine 在高 DPI 或控件缩放时，offset 坐标可能与地图坐标不一致。
    map.on('mousedown', function(e) {
      if (tool !== 'rect' || !drawingSourceReady) return;
      e.preventDefault();
      isDrawing = true;
      startPoint = e.point;
      lastPoint = e.point;
      map.dragPan.disable();
    });

    map.on('mousemove', function(e) {
      if (!isDrawing || !startPoint || tool !== 'rect') return;
      lastPoint = e.point;
      var p = map.unproject(e.point);
      var start = map.unproject(startPoint);
      var endLongitude = unwrapLongitude(p.lng, start.lng);
      scheduleRectanglePreview(
        Math.max(start.lat, p.lat), Math.min(start.lat, p.lat),
        Math.max(start.lng, endLongitude), Math.min(start.lng, endLongitude)
      );
    });

    function finishDrawing(point) {
      if (!isDrawing || !startPoint || tool !== 'rect') return;
      var endPoint = point || lastPoint;
      if (!endPoint) return;
      isDrawing = false;
      if (previewFrame !== null) {
        window.cancelAnimationFrame(previewFrame);
        previewFrame = null;
      }
      previewBounds = null;
      var start = map.unproject(startPoint);
      var end = map.unproject(endPoint);
      var endLongitude = unwrapLongitude(end.lng, start.lng);
      var west = Math.min(start.lng, endLongitude);
      var east = Math.max(start.lng, endLongitude);
      var south = Math.min(start.lat, end.lat);
      var north = Math.max(start.lat, end.lat);
      if (updateRectangle(north, south, east, west)) {
        showCoords(west, east, south, north);
        setStatus(text.selected, false);
      }
      startPoint = null;
      lastPoint = null;
      setTool('pan');
    }

    map.on('mouseup', function(e) { finishDrawing(e.point); });
    window.addEventListener('mouseup', function() { finishDrawing(); });

    map.getCanvas().addEventListener('contextmenu', function(e) { e.preventDefault(); });
    if (pointSelectionEnabled) {
      map.getCanvas().style.cursor = '';
      map.on('click', function(e) { addSelectedPoint(e.lngLat); });
    }
  });

  map.on('error', function(e) {
    var message = e && e.error && e.error.message ? e.error.message : '';
    setStatus(text.resourceError + message, true);
  });

  polarMapElement.addEventListener('pointerdown', function(event) {
    if (!isPolarActive() || tool !== 'rect' || !drawingSourceReady) return;
    var lonLat = polarPointerLonLat(event);
    if (!lonLat) return;
    event.preventDefault();
    polarDrawStart = lonLat;
    polarLastPointer = lonLat;
    polarMapElement.setPointerCapture(event.pointerId);
  }, true);

  polarMapElement.addEventListener('pointermove', function(event) {
    if (!polarDrawStart || tool !== 'rect') return;
    var lonLat = polarPointerLonLat(event);
    if (!lonLat) return;
    polarLastPointer = lonLat;
    var endLongitude = unwrapLongitude(lonLat[0], polarDrawStart[0]);
    scheduleRectanglePreview(
      Math.max(polarDrawStart[1], lonLat[1]), Math.min(polarDrawStart[1], lonLat[1]),
      Math.max(polarDrawStart[0], endLongitude), Math.min(polarDrawStart[0], endLongitude)
    );
  }, true);

  function finishPolarDrawing(event) {
    if (!polarDrawStart || tool !== 'rect') return;
    if (previewFrame !== null) {
      window.cancelAnimationFrame(previewFrame);
      previewFrame = null;
    }
    previewBounds = null;
    var lonLat = polarPointerLonLat(event) || polarLastPointer;
    var start = polarDrawStart;
    polarDrawStart = null;
    polarLastPointer = null;
    if (!lonLat) {
      setTool('pan');
      return;
    }
    var endLongitude = unwrapLongitude(lonLat[0], start[0]);
    var west = Math.min(start[0], endLongitude);
    var east = Math.max(start[0], endLongitude);
    var south = Math.min(start[1], lonLat[1]);
    var north = Math.max(start[1], lonLat[1]);
    if (east - west > 1e-6 && north - south > 1e-6
        && updateRectangle(north, south, east, west)) {
      showCoords(west, east, south, north);
      setStatus(text.selected, false);
    }
    setTool('pan');
  }

  polarMapElement.addEventListener('pointerup', finishPolarDrawing, true);
  polarMapElement.addEventListener('pointercancel', finishPolarDrawing, true);
  polarMapElement.addEventListener('click', function(event) {
    if (!isPolarActive() || !pointSelectionEnabled || tool !== 'pan') return;
    var lonLat = polarPointerLonLat(event);
    if (lonLat) addSelectedPoint({ lng: lonLat[0], lat: lonLat[1] });
  }, true);

  var polarResizeTimer = null;
  window.addEventListener('resize', function() {
    if (isPolarActive() && polarTileMap) {
      polarTileMap.resize();
      return;
    }
    if (!isPolarActive() || !polarWorld) return;
    if (polarResizeTimer !== null) window.clearTimeout(polarResizeTimer);
    polarResizeTimer = window.setTimeout(function() {
      polarResizeTimer = null;
      if (isPolarActive()) renderPolarMap();
    }, 120);
  });

  // ----------------------------------------------------------------
  //  Toolbar & 按钮事件
  // ----------------------------------------------------------------

  function setStyleMenuOpen(open) {
    styleSelectMenu.classList.toggle('visible', open);
    styleSelectButton.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  styleSelectButton.addEventListener('click', function() {
    setStyleMenuOpen(!styleSelectMenu.classList.contains('visible'));
  });

  styleSelect.addEventListener('selectstart', function(event) {
    event.preventDefault();
  });

  styleOptions.forEach(function(option, index) {
    option.addEventListener('click', function() {
      setStyleMenuOpen(false);
      switchStyle(option.dataset.value);
      styleSelectButton.focus();
    });
    option.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        setStyleMenuOpen(false);
        styleSelectButton.focus();
      } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        var step = event.key === 'ArrowDown' ? 1 : -1;
        styleOptions[(index + step + styleOptions.length) % styleOptions.length].focus();
      }
    });
  });

  styleSelectButton.addEventListener('keydown', function(event) {
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      setStyleMenuOpen(true);
      var selectedIndex = styleOptions.findIndex(function(option) {
        return option.dataset.value === currentStyle;
      });
      styleOptions[Math.max(0, selectedIndex)].focus();
    }
  });

  document.addEventListener('mousedown', function(event) {
    if (!styleSelect.contains(event.target)) setStyleMenuOpen(false);
  });

  polarZoomIn.addEventListener('click', function() {
    if (polarTileMap) polarTileMap.zoomBy(1);
  });
  polarZoomOut.addEventListener('click', function() {
    if (polarTileMap) polarTileMap.zoomBy(-1);
  });

  panBtn.addEventListener('click', function() {
    setTool('pan');
  });

  rectBtn.addEventListener('click', function() {
    if (!selectionEnabled || rectBtn.disabled) return;
    if (!drawingSourceReady) {
      setStatus(text.styleLoading, false);
      return;
    }
    clearRectangle();
    setTool('rect');
    setStatus(text.drawing, false);
  });

  confirmBtn.addEventListener('click', function() {
    if (!applyCoordinateInputs() || !hasRect || !currentRect) return;
    window.__globeResult = {
      west:  currentRect.west,
      east:  currentRect.east,
      south: currentRect.south,
      north: currentRect.north
    };
  });

  Object.keys(coordEls).forEach(function(key) {
    var field = coordEls[key];
    field.addEventListener('keydown', function(event) {
      event.stopPropagation();
      if (event.key === 'e' || event.key === 'E' || event.key === '+') {
        event.preventDefault();
      } else if (event.key === 'Enter') {
        event.preventDefault();
        applyCoordinateInputs();
      }
    });
    field.addEventListener('input', function() {
      readCoordinateInputs();
    });
    field.addEventListener('change', function() {
      applyCoordinateInputs();
    });
  });

  deletePointBtn.addEventListener('click', function() {
    if (!pointSelectionEnabled || selectedPoints.length === 0) return;
    selectedPoints.pop();
    renderPointMarkers();
    setStatus(text.pointReady, false);
  });

  confirmPointsBtn.addEventListener('click', function() {
    if (!pointSelectionEnabled) return;
    window.__globePointResult = selectedPoints.map(function(point) {
      return {
        lon: point.lon,
        lat: point.lat,
        name: String(point.name || ''),
        datetime: point.datetime == null ? undefined : String(point.datetime)
      };
    });
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && pointSelectionEnabled) confirmPointsBtn.click();
    else if (e.key === 'Enter' && hasRect) confirmBtn.click();
  });
})();
</script>
</body>
</html>
