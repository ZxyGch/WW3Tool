# WW3Tool 打包配置（原 setup.py 已合并进 run.py 的构建后端）。
#
# [build-system] build-backend = "run"：pip / `python3 -m build` 构建时把
# run.py 当作构建后端 import——构建 wheel/sdist 前先暂存运行资源
# （params.yml / public 子集 / meshgen 瘦身子集）进 src/ww3tool_resources/，
# 再转交 setuptools.build_meta。backend-path 让隔离构建环境能 import 仓库根的 run 模块。
#
# [EN] WW3Tool packaging config (setup.py merged into run.py's build backend).
# [build-system] build-backend = "run" lets pip / `python3 -m build` import
# run.py as the build backend: it stages runtime resources into
# src/ww3tool_resources/ before delegating to setuptools.build_meta.
# backend-path makes the isolated build env able to import the root run module.

[build-system]
requires = ["setuptools>=68"]
build-backend = "run"
backend-path = ["."]

[project]
name = "ww3tool"
version = "0.1.11"
description = "WW3Tool - WAVEWATCH III workflow toolkit (CLI / Shell REPL / Desktop GUI / MCP server)"
readme = "public/packaging/PYPI_README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "netCDF4",
    "pandas",
    "matplotlib",
    "cartopy",
    "Pillow",
    "scipy",
    "scikit-image",
    "opencv-python",
    "paramiko",
    "requests",
    "PyYAML",
    "pyfiglet",
    # GUI 桌面依赖并入主依赖：pip install ww3tool 一次装齐全部包
    # （桌面界面、WebEngine globe picker、Fluent 组件）。
    # [EN] GUI desktop deps merged into the main deps so a plain
    # `pip install ww3tool` installs everything.
    "PyQt6",
    "PyQt6-WebEngine",
    "PyQt6-Fluent-Widgets",
]

[project.optional-dependencies]
# 保留空 gui extra 兼容旧命令（pip install "ww3tool[gui]" 仍可用）。
# [EN] Keep an empty gui extra so legacy install commands still work.
gui = []
dev = ["pytest"]

# Windows 上不生成 ww3tool.exe（会被 Smart App Control / 应用控制策略拦截），
# 改为 script-files 提供 ww3tool.cmd（文本脚本不受拦，首次运行自动删除旧 exe）。
# Unix 用同名的 sh/python 启动脚本（setuptools 会重写 shebang 到安装解释器）。
# [EN] No console script on Windows: the ww3tool.exe launcher gets blocked by
# Smart App Control / app control policies. Instead ship ww3tool.cmd via
# script-files (text scripts are not blocked; it removes the legacy exe on
# first run). Unix gets a shebang script with the same name.
# [project.scripts]
# ww3tool = "run:main"

[tool.setuptools]
py-modules = ["run"]
script-files = [
    "public/packaging/scripts/ww3tool.cmd",
    "public/packaging/scripts/ww3tool",
]
packages = [
    "ww3tool_resources",
    "workflows",
    "workflows.support",
    "workflows.application",
    "workflows.infrastructure",
    "workflows.domain",
    "workflows.interfaces",
    "workflows.infrastructure.plot",
    "workflows.infrastructure.forcing",
    "workflows.infrastructure.ww3",
    "workflows.infrastructure.local",
    "workflows.infrastructure.adapters",
    "workflows.infrastructure.grid_visualization",
    "workflows.infrastructure.remote",
    "desktop",
    "desktop.view_models",
    "desktop.components",
    "desktop.steps",
    "desktop.windows",
]
include-package-data = false

[tool.setuptools.package-dir]
ww3tool_resources = "src/ww3tool_resources"
workflows = "src/workflows"
desktop = "src/desktop"

[tool.setuptools.package-data]
ww3tool_resources = ["**/*"]
