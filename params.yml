forcing:
  wind: null
  current: null
  level: null
  ice: null
  process_mode: copy
  auto_associate: true
grid:
  mesh_type: structured
  grid_type: normal
  gridgen_version: Python
  reference_data_path: null
  nested_contraction_coefficient: 1.3
  outer:
    dx: 0.05
    dy: 0.05
    lon:
    - 110.0
    - 130.0
    lat:
    - 10.0
    - 30.0
  structured:
    bathymetry: GEBCO
    coastline_precision: full
    min_dist: 20
    cut_off: 0
    lim_bathy: 0.4
    lim_val: 0.5
    split_lim: 0
    lake_tol: 50
  smc:
    bathymetry: ETOPO2
    bathy_convention: elevation
    n_levels: 2
    wlevel: 0
    depmin: 0
    dshalw: -150
    generate_boundary_cells: true
    msea: 1
    options:
      input:
        auto_flip_lat: true
        auto_flip_lon: true
        coord_spacing_rtol: 0.001
        coord_spacing_atol: 1.0e-08
        nan_fill_value: 1000.0
      grid:
        name: grid
        global: false
        arctic: false
        glb_arc_lat: 84.4
        origin:
          lon0: 0.0
          lat0: -90.0
      output:
        file_prefix: ''
  unstructured:
    hmax: 100
    hshr: 20
    nwav: 400
    dhdx: 0.05
    deep_ocean_threshold_m: 4000
    margin_deg: 1
    edge_segments: 64
    options:
      spacing:
        hmin: 20
      data:
        mask_file: ''
      command_line_args:
        black_sea: 3
      regional:
        stereo_lon: 120.0
        stereo_lat: 20.0
calc:
  mode: region
  points: []
  track_points: []
ww3:
  start_date: '20250101'
  end_date: '20250103'
  compute_precision: 1800
