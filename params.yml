# ────────────────────────────────────────────────────────────────────
# workdir:
#   path              Path string (work directory: intermediate files, WW3 namelists,
#                     forcing inputs, model output and post-processing results all go
#                     here). Quote paths containing spaces/special chars, e.g. "/my dir/ws".
#   default_workspace Path string. Default parent folder for new work directories; the
#                     `workdir <name>` command creates under here when given a bare name.
#                     Empty/missing → falls back to workSpace/.
# ────────────────────────────────────────────────────────────────────
workdir:
  path: /Users/zxy/ocean/Paper/WW3Tool/workSpace/new
  default_workspace: /Users/zxy/ocean/Paper/WW3Tool/workSpace
# ────────────────────────────────────────────────────────────────────
# grid: (grid generation settings; quote strings, especially those starting with a
#        digit or containing dots/spaces)
#   mesh_type           String enum, must be quoted: 'structured' | 'smc' | 'unstructured'
#   grid_type           String enum, must be quoted: 'normal' (single domain) | 'nested' (two-level refinement)
#   gridgen_version     String enum, must be quoted: 'Python' | 'MATLAB'
#   reference_data_path Path string (bathymetry/coastline data bundle); null = auto-detect
#   lon                 Array of numbers, exactly 2 floats: [west, east] in degrees, unquoted
#   lat                 Array of numbers, exactly 2 floats: [south, north] in degrees, unquoted
#   structured.nested.levels Array (coarse -> fine); each element is a dict:
#                      { dx: number, dy: number, lon: [w,e], lat: [s,n] }
#                      dx/dy in degrees; level0 is coarsest (bounds default to grid.lon/lat);
#                      finer levels have smaller dx and lie inside the previous one (2-99 levels).
# ────────────────────────────────────────────────────────────────────
grid:
  mesh_type: structured
  grid_type: normal
  gridgen_version: Python
  reference_data_path: /Users/zxy/ocean/Paper/WW3Tool/meshgen/reference_data
  lon:
  - 110.0
  - 130.0
  lat:
  - 10.0
  - 30.0
  # structured: (used only when mesh_type: structured; numbers unquoted)
  #   bathymetry          String enum: 'GEBCO' | 'ETOP1' | 'ETOP2'
  #   coastline_precision String enum: 'full' | 'high' | 'inter' | 'low' | 'coarse'
  #   min_dist            Number (int/float): min distance filter between adjacent grid points (km)
  #   cut_off             Number: land-sea mask cut-off; 0 = keep all sea points
  #   lim_bathy           Number (0-1): depth-based cell inclusion threshold (fraction of cell wet)
  #   lim_val             Number (0-1): masking threshold for cell classification
  #   split_lim           Number: split-cell limit; 0 = disabled
  #   lake_tol            Number (int): minimum lake area (cells) to keep; smaller lakes are filled
  #   nested.nested_contraction_coefficient Number (float, >=1): nested level boundary shrink ratio (GUI helper)
  structured:
    nested:
      nested_contraction_coefficient: 1.3
      levels:
      - dx: 0.05
        dy: 0.05
        lon:
        - 110.0
        - 130.0
        lat:
        - 10.0
        - 30.0
      - dx: 0.025
        dy: 0.025
        lon:
        - 115.0
        - 125.0
        lat:
        - 15.0
        - 25.0
    bathymetry: GEBCO
    coastline_precision: full
    min_dist: 20
    cut_off: 0
    lim_bathy: 0.4
    lim_val: 0.5
    split_lim: 0
    lake_tol: 50
  # smc: (spherical multi-cell grid; used only when mesh_type: smc; numbers unquoted)
  #   bathymetry          String enum: 'ETOP1' | 'ETOP2' | 'GEBCO'
  #   bathy_convention    String enum, must be quoted: 'elevation' (positive up) | 'depth' (positive down)
  #   n_levels            Number (int): number of cell-size refinement levels
  #   wlevel              Number (int): water-level reference index
  #   depmin              Number (int): cells shallower than this depth (m) are excluded
  #   dshalw              Number: shallow-water depth threshold for extra refinement (m), can be negative
  #   generate_boundary_cells Boolean (true/false, unquoted): create open-boundary ghost cells
  #   msea                Number (int): minimum cell count across straits
  #   options.input       Dict: low-level input pre-processing (auto-flip, tolerances)
  #     auto_flip_lat / auto_flip_lon  Boolean
  #     coord_spacing_rtol / coord_spacing_atol  Number (float): coordinate spacing tolerances
  #     nan_fill_value    Number (float): NaN fill value
  #   options.grid        Dict: grid identity & projection
  #     name              String
  #     global / arctic   Boolean
  #     glb_arc_lat       Number (float): arctic projection reference latitude
  #     origin.lon0 / origin.lat0  Number (float): projection origin lon/lat
  #   options.output      Dict: output file naming
  #     file_prefix       String (may be empty string '')
  smc:
    bathymetry: ETOPO2
    bathy_convention: elevation
    n_levels: 2
    wlevel: 0
    depmin: 0
    dshalw: -150
    generate_boundary_cells: true
    msea: 1
    options:
      input:
        auto_flip_lat: true
        auto_flip_lon: true
        coord_spacing_rtol: 0.001
        coord_spacing_atol: 1.0e-08
        nan_fill_value: 1000.0
      grid:
        name: grid
        global: false
        arctic: false
        glb_arc_lat: 84.4
        origin:
          lon0: 0.0
          lat0: -90.0
      output:
        file_prefix: ''
  # unstructured: (triangular unstructured grid; used only when mesh_type: unstructured)
  #   hmax / hmin / hshr  Number (float, km): max spacing in deep water / global min spacing / target nearshore spacing
  #   nwav                Number (int): wavelengths per element (resolution metric)
  #   dhdx                Number (float): rate of spacing change with depth gradient
  #   deep_ocean_threshold_m Number (int, m): hmax applies beyond this depth
  #   margin_deg          Number (float, deg): buffer margin around domain boundary
  #   edge_segments       Number (int): segments along coastlines
  #   options.data        Dict: optional mask / exclusion file
  #     mask_file         Path string (may be empty string '')
  #   options.command_line_args  Dict: extra JIGSAW CLI flags (values may be numbers, e.g. black_sea: 3)
  #   options.regional    Dict: stereographic projection centre
  #     stereo_lon / stereo_lat  Number (float, deg)
  unstructured:
    hmax: 100
    hmin: 2
    hshr: 20
    nwav: 400
    dhdx: 0.05
    deep_ocean_threshold_m: 4000
    margin_deg: 1
    edge_segments: 64
    options:
      data:
        mask_file: ''
      command_line_args:
        black_sea: 3
      regional:
        stereo_lon: 120.0
        stereo_lat: 20.0
# ────────────────────────────────────────────────────────────────────
# forcing: (forcing NetCDF files; quote paths containing spaces/special chars; null = field not provided)
#   wind              Path string or null: 10-m wind (U10/V10)
#   current           Path string or null: surface current (UCUR/VCUR)
#   level             Path string or null: sea-surface elevation anomaly (LEV)
#   ice               Path string or null: sea-ice concentration (IC1/IC5)
#   process_mode      String enum, must be quoted: 'copy' (copy complete files into workdir) | 'move' (move originals)
#   crop_time_range   Array of 2 date strings (YYYYMMDD, must be quoted): [start, end]; [] = no crop
#   crop_bbox         Array of 4 numbers: [west, east, south, north]; [] = no crop
#   auto_associate    Boolean (true/false, unquoted): true = auto-match forcing vars by filename keyword
# ────────────────────────────────────────────────────────────────────
forcing:
  wind: null
  current: null
  level: null
  ice: null
  process_mode: copy
  crop_time_range: []
  crop_bbox: []
  auto_associate: true
# ────────────────────────────────────────────────────────────────────
# calc: (calculation mode)
#   mode              String enum, must be quoted: 'region' (gridded output over full domain) | 'points' (specific locations only)
#   points            Array: each element is a [name, lon, lat] triple; name is a string (quoted),
#                     lon/lat are numbers (float). Example:
#                       points:
#                       - ["station1", 121.5, 25.0]
#   track_points      Array: list of moving-point tracks; each track is a list of [time, lon, lat] waypoints;
#                     time is a date string (YYYYMMDD or YYYYMMDDHHMM, must be quoted), lon/lat are numbers.
#                     Example:
#                       track_points:
#                       - [["20250101", 121.0, 24.0], ["20250102", 122.0, 25.0]]
# ────────────────────────────────────────────────────────────────────
calc:
  mode: region
  points: []
  track_points: []
# ────────────────────────────────────────────────────────────────────
# ww3: (WW3 model run settings)
#   version           String enum, must be quoted (otherwise YAML parses it as a number): '6.07' | '7.14'
#                     (reads the public/{version}_nml template directory)
#   start_date / end_date  Date strings (YYYYMMDD, must be quoted): simulation period
#   output_step       Number (int, seconds): output step for ww3_shel / ww3_ounp / ww3_ounf
#   file_split        String enum, must be quoted: 'single' | 'hour' | 'day' | 'month' | 'year'
#   output_scheme     Dict: output field scheme
#     standard        String (space-separated field abbreviations, quoted; prefix with <name> for multiple schemes)
#   restart           Dict: cold/hot start settings; checkpoint stride follows output_step
#     mode            String enum, must be quoted: 'cold' | 'hot'
#     restart_time    Date string (YYYYMMDDHHMMSS, quoted) or null
#     restart_file    Path string or null
#     restart_step    Number (int, seconds)
#     pick_latest_checkpoint  Boolean (true/false, unquoted)
#   namelist          Dict: source-term parameter overrides (SIN4% / SDS4% / SBT1% ...); values are numbers (float, unquoted)
# ────────────────────────────────────────────────────────────────────
ww3:
  version: 7.14
  start_date: '20000227'
  end_date: '20000228'
  output_step: 3600
  file_split: single
  output_scheme:
    standard: HS DIR FP T02 WND PHS PTP PDIR PWS PNR TWS
  restart:
    mode: cold
    restart_time: null
    restart_file: null
    restart_step: 0
    pick_latest_checkpoint: true
  namelist:
    SIN4%BETAMAX: 1.43
    SIN4%SWELLF: 0.66
    SDS4%SDSC2: -2.2e-05
    SDS4%SDSBR: 0.0009
    SBT1%GAMMA: -0.067
# ────────────────────────────────────────────────────────────────────
# ww3_grid: (overrides written into ww3_grid.nml at runtime; keys use Fortran namelist
#            syntax with '%' as sub-key separator; all values are numbers (int/float), unquoted)
#   SPECTRUM%XFR     Number (float): logarithmic frequency increment ratio (default 1.1)
#   SPECTRUM%FREQ1   Number (float, Hz): lowest discrete frequency
#   SPECTRUM%NK      Number (int): number of frequency bins
#   SPECTRUM%NTH     Number (int): number of directional bins
#   TIMESTEPS%DTMAX  Number (int, s): maximum overall time-step
#   TIMESTEPS%DTXY   Number (int, s): spatial propagation time-step
#   TIMESTEPS%DTKTH  Number (int, s): directional propagation time-step
#   TIMESTEPS%DTMIN  Number (int, s): minimum (source-term) time-step
# ────────────────────────────────────────────────────────────────────
ww3_grid:
  SPECTRUM%XFR: 1.1
  SPECTRUM%FREQ1: 0.0375
  SPECTRUM%NK: 35
  SPECTRUM%NTH: 36
  TIMESTEPS%DTMAX: 900
  TIMESTEPS%DTXY: 320
  TIMESTEPS%DTKTH: 300
  TIMESTEPS%DTMIN: 15
# ────────────────────────────────────────────────────────────────────
# slurm: (HPC cluster job-scheduler settings)
#   job_name   String or null (#SBATCH -J); null = use workdir name
#   partition  String: Slurm partition name
#   nodes      Number (int): number of nodes
#   cores      Number (int): cores per node
#   nodelist   String or null: explicit node list
#   time       String (HH:MM:SS, quoted) or null
#   mem        String (e.g. '190G', quoted)
#   server_st  Dict: server-side WW3 executable path mapping
#     use      String (contains spaces, must be quoted): active scheme name, e.g. '7.14 ST4_RECT'
#     other keys  Keys like '7.14 ST4' (contain spaces, must be quoted): path string (exe dir)
# ────────────────────────────────────────────────────────────────────
slurm:
  job_name: null
  partition: CPU6240R
  nodes: 1
  cores: 48
  nodelist: null
  time: null
  mem: 190G
  server_st:
    use: 7.14 ST4_RECT
    6.07 ST2: /public/home/weiyl001/bin/wavewatch3/6.07/st2_smc/model/exe
    6.07 ST4: /public/home/weiyl001/bin/wavewatch3/6.07/st4_smc/model/exe
    6.07 ST6: /public/home/weiyl001/bin/wavewatch3/6.07/st6_smc/model/exe
    6.07 ST2_RECT: /public/home/weiyl001/bin/wavewatch3/6.07/st2_rect/model/exe
    6.07 ST4_RECT: /public/home/weiyl001/bin/wavewatch3/6.07/st4_rect/model/exe
    6.07 ST6_RECT: /public/home/weiyl001/bin/wavewatch3/6.07/st6_rect/model/exe
    6.07 ST2_UNST: /public/home/weiyl001/bin/wavewatch3/6.07/st2_unst/model/exe
    6.07 ST4_UNST: /public/home/weiyl001/bin/wavewatch3/6.07/st4_unst/model/exe
    6.07 ST6_UNST: /public/home/weiyl001/bin/wavewatch3/6.07/st6_unst/model/exe
    7.14 ST2: /public/home/weiyl001/bin/wavewatch3/7.14/st2_smc/model/exe
    7.14 ST4: /public/home/weiyl001/bin/wavewatch3/7.14/st4_smc/model/exe
    7.14 ST6: /public/home/weiyl001/bin/wavewatch3/7.14/st6_smc/model/exe
    7.14 ST2_RECT: /public/home/weiyl001/bin/wavewatch3/7.14/st2_rect/model/exe
    7.14 ST4_RECT: /public/home/weiyl001/bin/wavewatch3/7.14/st4_rect/model/exe
    7.14 ST6_RECT: /public/home/weiyl001/bin/wavewatch3/7.14/st6_rect/model/exe
    7.14 ST2_UNST: /public/home/weiyl001/bin/wavewatch3/7.14/st2_unst/model/exe
    7.14 ST4_UNST: /public/home/weiyl001/bin/wavewatch3/7.14/st4_unst/model/exe
    7.14 ST6_UNST: /public/home/weiyl001/bin/wavewatch3/7.14/st6_unst/model/exe
# ────────────────────────────────────────────────────────────────────
# local_run: (Step 5 local execution settings)
#   local_st   Dict: local WW3 executable path mapping
#     use      String (contains spaces, must be quoted): active scheme name, e.g. '7.14 ST2 SMC'
#     other keys  Keys like '7.14 ST2 SMC' (contain spaces, must be quoted): path string (bin dir)
