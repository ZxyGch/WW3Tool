    6.07 ST4: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST4
    6.07 ST6: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST6
    6.07 ST2 SMC: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST2_SMC
    6.07 ST4 SMC: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST4_SMC
    6.07 ST6 SMC: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST6_SMC
# ────────────────────────────────────────────────────────────────────
# plot: (post-processing & validation plots; each sub-section is invoked individually
#        via CLI commands: plot-wave-maps / plot-spectrum / plot-jason3 / plot-ndbc / plot-wind)
# ────────────────────────────────────────────────────────────────────
plot:
  # wave_maps: (wave-height filled-colour maps / contour maps / video)
  #   time_step_hours     Number (int, hours): temporal sampling interval
  #   generate_video      Boolean (true/false): create an MP4 animation
  #   show_land_coastline Boolean: overlay coastline on maps
  #   dpi                 Number (int) or null (null = auto)
  #   figsize             Array [width, height] (inches, numbers) or null
  #   output_folder       Path string or null (null = workdir default)
  wave_maps:
    time_step_hours: 6
    generate_video: false
    show_land_coastline: true
    dpi: null
    figsize: null
    output_folder: null
  # spectrum: (2-D directional spectra at specified stations)
  #   time_step_hours  Number (int, hours)
  #   energy_threshold Number (float): minimum energy density to display
  #   plot_mode        String enum or null: 'normalized' | 'actual' (null = actual)
  spectrum:
    time_step_hours: 6
    energy_threshold: 0.01
    plot_mode: null
  # jason3: (Jason-3 satellite altimeter track matching / validation)
  #   data_folder       Path string or null: folder with downloaded Jason-3 files
  #   lon_lat           Array of 4 numbers: [west, east, south, north] matching region
  #   time_range        Array of 2 date strings (YYYYMMDD, must be quoted)
  #   max_dist_deg      Number (float, deg): max spatial mismatch for track matching
  #   time_window_hours Number (float, hours): max temporal mismatch window
  jason3:
    data_folder: null
    lon_lat:
    - 110.0
    - 130.0
    - 10.0
    - 30.0
    time_range:
    - '20250101'
    - '20250103'
    max_dist_deg: 0.125
    time_window_hours: 0.5
  # ndbc: (NDBC buoy observation matching or data download)
  #   data_folder  Path string or null: folder with NDBC station data
  #   download     Boolean (true/false): true = auto-download station data from NDBC
  #   time_range   Array of 2 date strings (YYYYMMDD, must be quoted)
  ndbc:
    data_folder: null
    download: false
    time_range:
    - '20250101'
    - '20250103'
  # wind_field: (wind-field filled-colour maps with optional arrow/barb overlays)
  #   time_step_hours  Number (int, hours) or null (null = auto from file)
  #   flag_type        String enum or null: 'arrow' | 'barb' | 'none'
  #   flag_density     Number (int) or null: spacing between flag glyphs (stride steps)
  wind_field:
    time_step_hours: null
    flag_type: null
    flag_density: null
