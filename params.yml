# ────────────────────────────────────────────────────────────────────
# workdir:
#   path              路径字符串（工作目录：中间文件、namelist、强迫场、输出全放这里）。
#                     路径含空格/特殊字符时用引号包住，如 "/my dir/ws"。
#   default_workspace 路径字符串。新建工作目录的默认父目录；`workdir <name>`
#                     用裸名字创建时放这里。留空/缺省 → 回退到 workSpace/。
# ────────────────────────────────────────────────────────────────────
workdir:
  path: /Users/zxy/ocean/Paper/WW3Tool/workSpace/new
  default_workspace: /Users/zxy/ocean/Paper/WW3Tool/workSpace
# ────────────────────────────────────────────────────────────────────
# grid:（网格生成设置；字符串统一建议加引号，尤其以数字开头或含点号/空格时）
#   mesh_type          字符串枚举，必须加引号：'structured' | 'smc' | 'unstructured'
#   grid_type          字符串枚举，必须加引号：'normal'（单域）| 'nested'（两层嵌套细化）
#   gridgen_version    字符串枚举，必须加引号：'Python' | 'MATLAB'
#   reference_data_path 路径字符串（水深/海岸线数据包）；null = 自动探测项目默认值
#   lon                数字数组，恰好 2 个浮点：[西经, 东经]，单位度，不加引号
#   lat                数字数组，恰好 2 个浮点：[南纬, 北纬]，单位度，不加引号
#   structured.nested.levels 数组（从粗到细），每个元素是字典：
#                      { dx: 数字, dy: 数字, lon: [西,东], lat: [南,北] }
#                      dx/dy 单位度；level0 最粗（边界默认取 grid.lon/lat），
#                      更细层 dx 更小且完全落在上一层内（2~99 层）。
# ────────────────────────────────────────────────────────────────────
grid:
  mesh_type: structured
  grid_type: normal
  gridgen_version: Python
  reference_data_path: /Users/zxy/ocean/Paper/WW3Tool/meshgen/reference_data
  lon:
  - 110.0
  - 130.0
  lat:
  - 10.0
  - 30.0
  # structured:（仅 mesh_type: structured 时生效；数字均不加引号）
  #   bathymetry          字符串枚举：'GEBCO' | 'ETOP1' | 'ETOP2'
  #   coastline_precision 字符串枚举：'full' | 'high' | 'inter' | 'low' | 'coarse'
  #   min_dist            数字（整数/浮点）：相邻网格点最小距离过滤（km）
  #   cut_off             数字：陆海掩膜截断值，0 = 保留全部海点
  #   lim_bathy           数字（0~1）：按水深含湿比例决定保留哪些单元
  #   lim_val             数字（0~1）：单元分类掩膜阈值
  #   split_lim           数字：分裂单元上限，0 = 禁用
  #   lake_tol            数字（整数）：保留的最小湖泊面积（格点数），更小则填平
  #   nested.nested_contraction_coefficient 数字（浮点，≥1）：嵌套层边界收缩比（GUI 辅助）
  structured:
    nested:
      nested_contraction_coefficient: 1.3
      levels:
      - dx: 0.05
        dy: 0.05
        lon:
        - 110.0
        - 130.0
        lat:
        - 10.0
        - 30.0
      - dx: 0.025
        dy: 0.025
        lon:
        - 115.0
        - 125.0
        lat:
        - 15.0
        - 25.0
    bathymetry: GEBCO
    coastline_precision: full
    min_dist: 20
    cut_off: 0
    lim_bathy: 0.4
    lim_val: 0.5
    split_lim: 0
    lake_tol: 50
  # smc:（球面多单元网格，仅 mesh_type: smc 时生效；数字均不加引号）
  #   bathymetry          字符串枚举：'ETOP1' | 'ETOP2' | 'GEBCO'
  #   bathy_convention    字符串枚举，必须加引号：'elevation'（高程上正下负）| 'depth'（深度下正上负）
  #   n_levels            数字（整数）：网格细化层数
  #   wlevel              数字（整数）：水位参考索引
  #   depmin              数字（整数）：低于此深度（m）的单元被排除
  #   dshalw              数字：浅水额外细化深度阈值（m），可为负
  #   generate_boundary_cells 布尔（true/false，不加引号）：是否生成开边界 ghost 单元
  #   msea                数字（整数）：海峡最小单元数
  #   options.input       字典：底层输入预处理（自动翻转、容差）
  #     auto_flip_lat / auto_flip_lon  布尔
  #     coord_spacing_rtol / coord_spacing_atol  数字（浮点）：坐标间距容差
  #     nan_fill_value    数字（浮点）：NaN 填充值
  #   options.grid        字典：网格标识与投影
  #     name              字符串
  #     global / arctic   布尔
  #     glb_arc_lat       数字（浮点）：北极投影参考纬度
  #     origin.lon0 / origin.lat0  数字（浮点）：投影原点经纬度
  #   options.output      字典：输出文件命名
  #     file_prefix       字符串（可空字符串 ''）
  smc:
    bathymetry: ETOPO2
    bathy_convention: elevation
    n_levels: 2
    wlevel: 0
    depmin: 0
    dshalw: -150
    generate_boundary_cells: true
    msea: 1
    options:
      input:
        auto_flip_lat: true
        auto_flip_lon: true
        coord_spacing_rtol: 0.001
        coord_spacing_atol: 1.0e-08
        nan_fill_value: 1000.0
      grid:
        name: grid
        global: false
        arctic: false
        glb_arc_lat: 84.4
        origin:
          lon0: 0.0
          lat0: -90.0
      output:
        file_prefix: ''
  # unstructured:（三角形非结构网格，仅 mesh_type: unstructured 时生效）
  #   hmax / hmin / hshr  数字（浮点，km）：深水最大间距 / 全局最小间距 / 近岸目标间距
  #   nwav                数字（整数）：每个单元覆盖的波长数（分辨率指标）
  #   dhdx                数字（浮点）：间距随水深梯度的变化率
  #   deep_ocean_threshold_m 数字（整数，m）：超过此水深后 hmax 生效
  #   margin_deg          数字（浮点，度）：域边界缓冲余量
  #   edge_segments       数字（整数）：海岸线分段数
  #   options.data        字典：可选掩膜/排除文件
  #     mask_file         路径字符串（可空字符串 ''）
  #   options.command_line_args  字典：额外 JIGSAW CLI 参数（值可为数字，如 black_sea: 3）
  #   options.regional    字典：球面投影中心
  #     stereo_lon / stereo_lat  数字（浮点，度）
  unstructured:
    hmax: 100
    hmin: 2
    hshr: 20
    nwav: 400
    dhdx: 0.05
    deep_ocean_threshold_m: 4000
    margin_deg: 1
    edge_segments: 64
    options:
      data:
        mask_file: ''
      command_line_args:
        black_sea: 3
      regional:
        stereo_lon: 120.0
        stereo_lat: 20.0
# ────────────────────────────────────────────────────────────────────
# forcing:（强迫场 NetCDF 文件；路径含空格/特殊字符时加引号，null = 不提供该场）
#   wind              路径字符串或 null：10m 风（U10/V10）
#   current           路径字符串或 null：表层流（UCUR/VCUR）
#   level             路径字符串或 null：海面高度异常（LEV）
#   ice               路径字符串或 null：海冰浓度（IC1/IC5）
#   process_mode      字符串枚举，必须加引号：'copy'（复制完整文件到 workdir）| 'move'（移动原件）
#   crop_time_range   数组，2 个日期字符串（YYYYMMDD，必须加引号）：[开始, 结束]；[] = 不裁剪
#   crop_bbox         数组，4 个数字：[西, 东, 南, 北]；[] = 不裁剪
#   auto_associate    布尔（true/false，不加引号）：true = 按文件名关键词自动匹配强迫场变量
# ────────────────────────────────────────────────────────────────────
forcing:
  wind: null
  current: null
  level: null
  ice: null
  process_mode: copy
  crop_time_range: []
  crop_bbox: []
  auto_associate: true
# ────────────────────────────────────────────────────────────────────
# calc:（计算模式）
#   mode              字符串枚举，必须加引号：'region'（全域网格输出）| 'points'（仅特定点输出）
#   points            数组：每个元素是 [名称, 经度, 纬度] 三元组；名称是字符串（加引号），
#                     经/纬度是数字（浮点）。示例：
#                       points:
#                       - ["station1", 121.5, 25.0]
#   track_points      数组：航迹（移动点）列表，每个航迹是一个点列表，每点 [时间, 经度, 纬度]；
#                     时间是日期字符串（YYYYMMDD 或 YYYYMMDDHHMM，必须加引号），经/纬度是数字。
#                     示例：
#                       track_points:
#                       - [["20250101", 121.0, 24.0], ["20250102", 122.0, 25.0]]
# ────────────────────────────────────────────────────────────────────
calc:
  mode: region
  points: []
  track_points: []
# ────────────────────────────────────────────────────────────────────
# ww3:（WW3 模型运行设置）
#   version          字符串枚举，必须加引号（否则会被 YAML 解析成数字）：'6.07' | '7.14'
#                    （读取 public/{version}_nml 模板目录）
#   start_date / end_date  日期字符串（YYYYMMDD，必须加引号）：模拟时段
#   output_step      数字（整数，秒）：ww3_shel / ww3_ounp / ww3_ounf 输出步长
#   file_split       字符串枚举，必须加引号：'single' | 'hour' | 'day' | 'month' | 'year'
#   output_scheme    字典：输出字段方案
#     standard       字符串（空格分隔的字段缩写，加引号；多方案时用 <名称> 前缀）
#   restart          字典：冷/热启动设置；检查点步长跟随 output_step
#     mode           字符串枚举，必须加引号：'cold' | 'hot'
#     restart_time   日期字符串（YYYYMMDDHHMMSS，加引号）或 null
#     restart_file   路径字符串或 null
#     restart_step   数字（整数，秒）
#     pick_latest_checkpoint  布尔（true/false，不加引号）
#   namelist         字典：SIN4% / SDS4% / SBT1% 等源项参数覆盖，值均为数字（浮点，不加引号）
# ────────────────────────────────────────────────────────────────────
ww3:
  version: 7.14
  start_date: '20000227'
  end_date: '20000228'
  output_step: 3600
  file_split: single
  output_scheme:
    standard: HS DIR FP T02 WND PHS PTP PDIR PWS PNR TWS
  restart:
    mode: cold
    restart_time: null
    restart_file: null
    restart_step: 0
    pick_latest_checkpoint: true
  namelist:
    SIN4%BETAMAX: 1.43
    SIN4%SWELLF: 0.66
    SDS4%SDSC2: -2.2e-05
    SDS4%SDSBR: 0.0009
    SBT1%GAMMA: -0.067
# ────────────────────────────────────────────────────────────────────
# ww3_grid:（写进 ww3_grid.nml 的覆盖项；键用 Fortran namelist 语法，'%' 分隔子键；
#            所有值都是数字（整数/浮点），不加引号）
#   SPECTRUM%XFR    数字（浮点）：对数频率增量比（默认 1.1）
#   SPECTRUM%FREQ1  数字（浮点，Hz）：最低离散频率
#   SPECTRUM%NK     数字（整数）：频率格点数
#   SPECTRUM%NTH    数字（整数）：方向格点数
#   TIMESTEPS%DTMAX 数字（整数，秒）：最大全局时间步
#   TIMESTEPS%DTXY  数字（整数，秒）：空间传播时间步
#   TIMESTEPS%DTKTH 数字（整数，秒）：方向传播时间步
#   TIMESTEPS%DTMIN 数字（整数，秒）：最小（源项）时间步
# ────────────────────────────────────────────────────────────────────
ww3_grid:
  SPECTRUM%XFR: 1.1
  SPECTRUM%FREQ1: 0.0375
  SPECTRUM%NK: 35
  SPECTRUM%NTH: 36
  TIMESTEPS%DTMAX: 900
  TIMESTEPS%DTXY: 320
  TIMESTEPS%DTKTH: 300
  TIMESTEPS%DTMIN: 15
# ────────────────────────────────────────────────────────────────────
# slurm:（HPC 集群作业调度设置）
#   job_name   字符串或 null（#SBATCH -J）；null = 用 workdir 名
#   partition  字符串：Slurm 分区名
#   nodes      数字（整数）：节点数
#   cores      数字（整数）：每节点核数
#   nodelist   字符串或 null：指定节点列表
#   time       字符串（HH:MM:SS，加引号）或 null
#   mem        字符串（如 '190G'，建议加引号）
#   server_st  字典：服务端 WW3 可执行文件路径映射
#     use      字符串（含空格，必须加引号）：当前使用的方案名，如 '7.14 ST4_RECT'
#     其它键   形如 '7.14 ST4'（含空格，必须加引号）: 路径字符串（exe 目录）
# ────────────────────────────────────────────────────────────────────
slurm:
  job_name: null
  partition: CPU6240R
  nodes: 1
  cores: 48
  nodelist: null
  time: null
  mem: 190G
  server_st:
    use: 7.14 ST4_RECT
    6.07 ST2: /public/home/weiyl001/bin/wavewatch3/6.07/st2_smc/model/exe
    6.07 ST4: /public/home/weiyl001/bin/wavewatch3/6.07/st4_smc/model/exe
    6.07 ST6: /public/home/weiyl001/bin/wavewatch3/6.07/st6_smc/model/exe
    6.07 ST2_RECT: /public/home/weiyl001/bin/wavewatch3/6.07/st2_rect/model/exe
    6.07 ST4_RECT: /public/home/weiyl001/bin/wavewatch3/6.07/st4_rect/model/exe
    6.07 ST6_RECT: /public/home/weiyl001/bin/wavewatch3/6.07/st6_rect/model/exe
    6.07 ST2_UNST: /public/home/weiyl001/bin/wavewatch3/6.07/st2_unst/model/exe
    6.07 ST4_UNST: /public/home/weiyl001/bin/wavewatch3/6.07/st4_unst/model/exe
    6.07 ST6_UNST: /public/home/weiyl001/bin/wavewatch3/6.07/st6_unst/model/exe
    7.14 ST2: /public/home/weiyl001/bin/wavewatch3/7.14/st2_smc/model/exe
    7.14 ST4: /public/home/weiyl001/bin/wavewatch3/7.14/st4_smc/model/exe
    7.14 ST6: /public/home/weiyl001/bin/wavewatch3/7.14/st6_smc/model/exe
    7.14 ST2_RECT: /public/home/weiyl001/bin/wavewatch3/7.14/st2_rect/model/exe
    7.14 ST4_RECT: /public/home/weiyl001/bin/wavewatch3/7.14/st4_rect/model/exe
    7.14 ST6_RECT: /public/home/weiyl001/bin/wavewatch3/7.14/st6_rect/model/exe
    7.14 ST2_UNST: /public/home/weiyl001/bin/wavewatch3/7.14/st2_unst/model/exe
    7.14 ST4_UNST: /public/home/weiyl001/bin/wavewatch3/7.14/st4_unst/model/exe
    7.14 ST6_UNST: /public/home/weiyl001/bin/wavewatch3/7.14/st6_unst/model/exe
# ────────────────────────────────────────────────────────────────────
# local_run:（第 5 步本地执行设置）
#   local_st  字典：本地 WW3 可执行文件路径映射
#     use      字符串（含空格，必须加引号）：当前使用的方案名，如 '7.14 ST2 SMC'
#     其它键   形如 '7.14 ST2 SMC'（含空格，必须加引号）: 路径字符串（bin 目录）
# ────────────────────────────────────────────────────────────────────
local_run:
  local_st:
    use: 7.14 ST2 SMC
    7.14 ST2 SMC: /Users/zxy/ocean/Paper/WW3/build/ST2/bin
    7.14 ST4: /Users/zxy/ocean/Paper/WW3/build/ST4/bin
    6.07 ST2: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST2
    6.07 ST4: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST4
    6.07 ST6: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST6
    6.07 ST2 SMC: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST2_SMC
    6.07 ST4 SMC: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST4_SMC
    6.07 ST6 SMC: /Users/zxy/ocean/Paper/WW3-6.07.1/model/exe_ST6_SMC
# ────────────────────────────────────────────────────────────────────
# plot:（后处理与验证绘图；各子段由对应 CLI 命令单独调用）
#   plot-wave-maps / plot-spectrum / plot-jason3 / plot-ndbc / plot-wind
# ────────────────────────────────────────────────────────────────────
plot:
  # wave_maps:（波高填色图 / 等值线图 / 视频）
  #   time_step_hours     数字（整数，小时）：时间采样间隔
  #   generate_video      布尔（true/false）：是否生成 MP4 动画
  #   show_land_coastline 布尔：图上叠加海岸线
  #   dpi                 数字（整数）或 null（null = 自动）
  #   figsize             数组 [宽, 高]（英寸，数字）或 null
  #   output_folder       路径字符串或 null（null = workdir 默认）
  wave_maps:
    time_step_hours: 6
    generate_video: false
    show_land_coastline: true
    dpi: null
    figsize: null
    output_folder: null
  # spectrum:（指定站点的 2D 方向谱）
  #   time_step_hours  数字（整数，小时）
  #   energy_threshold 数字（浮点）：最小显示能量密度
  #   plot_mode        字符串枚举或 null：'normalized' | 'actual'（null = actual）
  spectrum:
    time_step_hours: 6
    energy_threshold: 0.01
    plot_mode: null
  # jason3:（Jason-3 卫星高度计轨道匹配/验证）
  #   data_folder       路径字符串或 null：已下载 Jason-3 数据目录
  #   lon_lat           数组，4 个数字：[西, 东, 南, 北] 匹配区域
  #   time_range        数组，2 个日期字符串（YYYYMMDD，必须加引号）
  #   max_dist_deg      数字（浮点，度）：轨道匹配最大空间误差
  #   time_window_hours 数字（浮点，小时）：最大时间窗
  jason3:
    data_folder: null
    lon_lat:
    - 110.0
    - 130.0
    - 10.0
    - 30.0
    time_range:
    - '20250101'
    - '20250103'
    max_dist_deg: 0.125
    time_window_hours: 0.5
  # ndbc:（NDBC 浮标观测匹配或数据下载）
  #   data_folder  路径字符串或 null：NDBC 站数据目录
  #   download     布尔（true/false）：true = 自动从 NDBC 下载站数据
  #   time_range   数组，2 个日期字符串（YYYYMMDD，必须加引号）
  ndbc:
    data_folder: null
    download: false
    time_range:
    - '20250101'
    - '20250103'
  # wind_field:（风场填色图，可叠加风矢/风羽）
  #   time_step_hours  数字（整数，小时）或 null（null = 从文件自动）
  #   flag_type        字符串枚举或 null：'arrow' | 'barb' | 'none'
  #   flag_density     数字（整数）或 null：风矢/风羽间距（步长）
  wind_field:
    time_step_hours: null
    flag_type: null
    flag_density: null
# ────────────────────────────────────────────────────────────────────
# server:（远端 SSH / SFTP 连接设置）
#   host               字符串或 null：主机名或 IP（加引号）
#   port               数字（整数）：SSH 端口（默认 22）
