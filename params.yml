# ────────────────────────────────────────────────────────────────────
# Preset definitions: reusable named lists that are referenced by name
# in other sections. Avoids duplicating long lists across configs.
#
#   output_scheme  – named lists of WW3 output field abbreviations.
#     'standard'      : essential wave parameters (HS, DIR, FP, T02 …).
#     'with_spectrum'  : standard + 2-D energy density (EF).
#     'all_fields'     : every available WW3 output variable.
#   server_st           – server WW3 binary paths keyed by scheme name
#                          (ST2 / ST4 / ST6 / ST6A / ST6B).
#   local_st           – local WW3 binary paths keyed by scheme name
#                          (used by local run panel).
#   structured_bathymetry – bathymetry datasets available for structured grids
#                          (GEBCO / ETOPO1 / ETOPO2).
#   smc_bathymetry      – bathymetry datasets for SMC grids.
#   coastline_precision – GSHHG coastline resolution levels
#                          (full > high > inter > low > coarse).
#   file_split          – output file splitting strategies
#                          (none / hour / day / month / year).
# ────────────────────────────────────────────────────────────────────
